<!DOCTYPE html>

<html lang="hu"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiscsirke Kikelés Szimuláció</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Fő konténer a HTML div tag-hez */
        #incubator-container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        /* Tojások és csirkék rácsa */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .slot {
            background: #f9f9f9;
            border: 2px dashed #dcdde1;
            border-radius: 10px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            transition: all 0.4s ease;
            position: relative;
        }

        /* Státusz üzenet */
        #status-message {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2980b9;
            min-height: 30px;
            margin-bottom: 25px;
        }

        /* Vezérlőgombok */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .reset-btn {
            background-color: #e74c3c;
        }
        .reset-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div id="incubator-container">
        <h1>Tojás Inkubátor Szimuláció</h1>
        <p class="subtitle">12 tojás / 12 pozíció</p>

        <div id="status-message">Mindenki kikellett változó csoportokban!</div>

        <div class="grid" id="egg-grid"><div class="slot" id="slot-0">🐥</div><div class="slot" id="slot-1">🐥</div><div class="slot" id="slot-2">🐥</div><div class="slot" id="slot-3">🐥</div><div class="slot" id="slot-4">🐥</div><div class="slot" id="slot-5">🐥</div><div class="slot" id="slot-6">🐥</div><div class="slot" id="slot-7">🐥</div><div class="slot" id="slot-8">🐥</div><div class="slot" id="slot-9">🐥</div><div class="slot" id="slot-10">🐥</div><div class="slot" id="slot-11">🐥</div></div>

        <div class="controls">
            <button onclick="runSimulation(&#39;allAtOnce&#39;)">1. Egyszerre mind</button>
            <button onclick="runSimulation(&#39;oneByOne&#39;)">2. Egyenként</button>
            <button onclick="runSimulation(&#39;someFail&#39;)">3. Egyesek nem kelnek ki</button>
            <button onclick="runSimulation(&#39;randomGroup&#39;)">4. Véletlenszerű csoportok</button>
            <button onclick="runSimulation(&#39;none&#39;)">5. Egy sem kel ki</button>
            <button class="reset-btn" onclick="resetEggs()">Visszaállítás</button>
        </div>
    </div>

    <script>
        const TOTAL_EGGS = 12;
        const gridElement = document.getElementById('egg-grid');
        const statusElement = document.getElementById('status-message');
        let isRunning = false;

        // Kezdeti rács felépítése (tojásokkal)
        function initGrid() {
            gridElement.innerHTML = '';
            for (let i = 0; i < TOTAL_EGGS; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.id = `slot-${i}`;
                slot.innerHTML = '🥚'; // Tojás emoji
                gridElement.appendChild(slot);
            }
        }

        // Visszaállítás alapállapotba
        function resetEggs() {
            if (isRunning) return;
            initGrid();
            statusElement.textContent = "A tojások készen állnak.";
        }

        // Segédfüggvény várakozáshoz (async/await)
        const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

        // Fő szimulációs vezérlő
        async function runSimulation(type) {
            if (isRunning) return;
            isRunning =- true;
            resetEggs();
            await delay(300);

            switch(type) {
                case 'allAtOnce':
                    statusElement.textContent = "Mind a 12 kiscsirke egyszerre bújik ki...";
                    await delay(600);
                    for (let i = 0; i < TOTAL_EGGS; i++) {
                        document.getElementById(`slot-${i}`).innerHTML = '🐥';
                    }
                    statusElement.textContent = "Siker! Mind a 12 kiscsirke kikellett.";
                    break;

                case 'oneByOne':
                    statusElement.textContent = "A kiscsirkék egyenként, sorban kelnek ki...";
                    for (let i = 0; i < TOTAL_EGGS; i++) {
                        await delay(400);
                        document.getElementById(`slot-${i}`).innerHTML = '🐥';
                    }
                    statusElement.textContent = "Mind a 12 kiscsirke kikellett egyenként.";
                    break;

                case 'someFail':
                    statusElement.textContent = "A kikelés folyamatban, de néhány tojás üres marad...";
                    // Tegyük fel, hogy a 2., 5., 8. és 11. indexű tojás nem kel ki (helyette ❌ vagy marad 🥚)
                    const failedIndices = [2, 5, 8, 11];
                    for (let i = 0; i < TOTAL_EGGS; i++) {
                        await delay(300);
                        const slot = document.getElementById(`slot-${i}`);
                        if (failedIndices.includes(i)) {
                            slot.innerHTML = '❌'; // Nem kelt ki
                            slot.style.borderColor = '#e74c3c';
                        } else {
                            slot.innerHTML = '🐥';
                        }
                    }
                    statusElement.textContent = "A szimuláció vége: Néhány kiscsirke bújt ki, de voltak rossz tojások is.";
                    break;

                case 'randomGroup':
                    statusElement.textContent = "Kettesével, többesével véletlenszerűen kelnek ki...";
                    let remaining = [...Array(TOTAL_EGGS).keys()];
                    // Keverjük össze a listát
                    remaining.sort(() => Math.random() - 0.5);

                    while (remaining.length > 0) {
                        await delay(600);
                        // Húzunk egy random méretű csoportot (1-3 db)
                        const groupSize = Math.min(Math.floor(Math.random() * 3) + 1, remaining.length);
                        for (let j = 0; j < groupSize; j++) {
                            const index = remaining.pop();
                            document.getElementById(`slot-${index}`).innerHTML = '🐥';
                        }
                    }
                    statusElement.textContent = "Mindenki kikellett változó csoportokban!";
                    break;

                case 'none':
                    statusElement.textContent = "Várakozás a kikelésre...";
                    await delay(1000);
                    for (let i = 0; i < TOTAL_EGGS; i++) {
                        const slot = document.getElementById(`slot-${i}`);
                        slot.innerHTML = '💤'; // Alvó / megromlott
                        slot.style.borderColor = '#95a5a6';
                    }
                    statusElement.textContent = "Sajnos egyetlen kiscsirke sem bújt ki.";
                    break;
            }

            isRunning = false;
        }

        // Oldal betöltésekor inicializálás
        initGrid();
    </script>


</body></html>
