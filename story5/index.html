    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .main-wrapper { max-width: 1100px; margin: 0 auto; }
        h1 { color: #38bdf8; font-size: 2.2rem; margin-bottom: 0.5rem; text-align: center; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 2rem; }
        
        /* FEJLÉC ÉS VEZÉRLŐ PANEL */
        .controls, .input-panel {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.2rem;
            border-radius: 16px;
            border: 1px solid #38bdf8;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .controls {
            position: sticky; top: 1rem; z-index: 100;
            display: flex; justify-content: center; align-items: center; gap: 0.8rem; flex-wrap: wrap;
        }
        .btn {
            background: #0369a1; color: #ffffff; border: none; padding: 0.6rem 1.1rem;
            border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer;
            transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 0.4rem;
        }
        .btn:hover { background: #38bdf8; color: #0f172a; }
        .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .btn-danger { background: #991b1b; } .btn-danger:hover { background: #f87171; color: #fff; }
        .btn-success { background: #166534; } .btn-success:hover { background: #4ade80; color: #0f172a; }
        .btn-warning { background: #854d0e; } .btn-warning:hover { background: #facc15; color: #0f172a; }
        .btn-recording { background: #dc2626 !important; color: #fff !important; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        .input-group { display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1rem; }
        .input-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        input[type="text"], input[type="number"], input[type="url"], textarea {
            width: 100%; padding: 0.8rem; background: #0f172a; border: 1px solid #334155;
            color: #f8fafc; border-radius: 8px; font-family: inherit; font-size: 0.95rem;
        }
        textarea { resize: vertical; min-height: 110px; }

        /* FELSŐ RUHAKÖTÉL VEKTOR-PANEL */
        .clothesline-wrapper {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #38bdf8; border-radius: 16px; padding: 2rem 1rem;
            margin-bottom: 2.5rem; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .clothesline-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem; padding: 0 1rem; flex-wrap: wrap; gap: 1rem;
        }
        .clothesline-container {
            display: flex; align-items: flex-start; justify-content: space-between;
            position: relative; min-height: 200px; padding: 0 50px;
        }
        .tree { font-size: 4rem; z-index: 2; user-select: none; filter: drop-shadow(0 10px 5px rgba(0,0,0,0.5)); }
        .rope {
            position: absolute; top: 35px; left: 80px; right: 80px; height: 4px;
            background: #d97706; border-radius: 2px; z-index: 1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        .clothes-list {
            display: flex; gap: 15px; z-index: 3; position: absolute; top: 28px;
            left: 90px; right: 90px; overflow-x: auto; padding-bottom: 15px;
        }
        .cloth-item {
            position: relative; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: transform 0.3s ease, filter 0.3s ease;
            animation: hangIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform-origin: top center; flex-shrink: 0;
        }
        .cloth-item:hover { transform: scale(1.1) translateY(-5px) !important; }
        .cloth-item.selected .cloth-shape { border: 2px solid #facc15; box-shadow: 0 0 15px #facc15; }
        
        .pegs { display: flex; gap: 12px; z-index: 4; margin-bottom: -4px; }
        .peg { width: 4px; height: 12px; background: #f59e0b; border-radius: 2px; }

        .cloth-shape {
            width: 75px; height: 85px; border-radius: 8px; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            color: #fff; font-weight: bold; font-size: 0.8rem; text-align: center;
            padding: 5px; box-shadow: 0 8px 15px rgba(0,0,0,0.4); position: relative;
        }
        .cloth-shape::before {
            content: ''; position: absolute; top: 0; width: 24px; height: 10px;
            background: #0f172a; border-radius: 0 0 12px 12px;
        }
        .cloth-delete-btn {
            position: absolute; top: -8px; right: -8px; background: #ef4444; color: white;
            border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5); z-index: 5;
        }

        @keyframes hangIn {
            0% { opacity: 0; transform: translateY(-60px) scale(0.5); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ESETTANULMÁNY KÁRTYÁK STÍLUSA */
        .section-box {
            background: #1e293b; border: 1px solid #334155; border-radius: 12px;
            padding: 2rem; margin-bottom: 2.5rem; position: relative;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); transition: all 0.3s ease;
        }
        .tag { display: inline-block; background: #0369a1; color: #e0f2fe; font-size: 0.8rem; padding: 0.3rem 0.6rem; border-radius: 4px; font-weight: bold; }
        
        h2 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 1rem; border-bottom: 2px solid #334155; padding-bottom: 0.5rem; }
        h3 { color: #facc15; font-size: 1.1rem; margin-top: 1rem; margin-bottom: 0.5rem; }

        /* SORKÖVETŐ MONDATOK STÍLUSA */
        .text-display-area {
            background: #0f172a; border: 1px solid #334155; padding: 1.2rem;
            border-radius: 8px; line-height: 1.8; font-size: 1rem; margin-bottom: 1rem;
        }
        .sentence {
            transition: background-color 0.2s ease, color 0.2s ease;
            border-radius: 4px; padding: 2px 4px; cursor: pointer; display: inline;
        }
        .sentence:hover { background-color: rgba(56, 189, 248, 0.25); }
        .sentence.active-sentence {
            background-color: #facc15 !important; color: #0f172a !important;
            font-weight: bold; box-shadow: 0 0 8px #facc15;
        }

        .analysis-box { background: #0f172a; border-left: 4px solid #38bdf8; padding: 1.5rem; margin-top: 1.5rem; border-radius: 0 8px 8px 0; }

        /* MULTIMÉDIA ÉS LINK PANEL */
        .link-inputs-grid { display: grid; gap: 0.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .media-preview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; border: 1px solid #38bdf8; }
        .video-container iframe, .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .image-preview { width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; border: 1px solid #38bdf8; }

        /* ALSÓ VÍZSZINTES ÖSSZEKÖTÖTT ELEMLÁNC */
        .bottom-chain-wrapper {
            background: #1e293b; border: 2px dashed #38bdf8; border-radius: 16px;
            padding: 1.5rem; margin-top: 3rem; margin-bottom: 2rem; text-align: center;
        }
        .chain-flex {
            display: flex; align-items: center; justify-content: center;
            gap: 0.5rem; overflow-x: auto; padding: 1rem 0;
        }
        .chain-node {
            background: #0369a1; color: white; padding: 0.8rem 1.2rem;
            border-radius: 8px; font-weight: bold; border: 1px solid #38bdf8;
            min-width: 140px; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .chain-connector { color: #facc15; font-size: 1.5rem; font-weight: bold; }

        /* SIMULATOR STYLES */
        .sim-container { background: #0f172a; border: 2px solid #38bdf8; border-radius: 12px; padding: 1.5rem; margin-top: 1rem; }
        .sim-controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .array-display { display: flex; justify-content: center; align-items: center; gap: 10px; min-height: 100px; background: #1e293b; border-radius: 8px; padding: 1rem; overflow-x: auto; }
        .array-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 60px; height: 60px; background: #0369a1; color: #fff; font-weight: bold; border-radius: 8px; position: relative; }
        .array-cell .index-label { position: absolute; top: -20px; font-size: 0.75rem; color: #38bdf8; }
        .sim-log { margin-top: 1rem; padding: 0.8rem; background: #1e293b; border-radius: 6px; font-family: monospace; color: #38bdf8; }
        
        /* EXPORTÁLÓ GOMBSZOR A LAP ALJÁN */
        .export-actions-bar {
            display: flex; gap: 1rem; justify-content: center; align-items: center;
            margin: 2rem 0; flex-wrap: wrap; background: #1e293b; padding: 1.5rem;
            border-radius: 12px; border: 1px solid #38bdf8;
        }
    </style>

                .replace(/(^|[.!?]\\s+)([a-zárvíztükörfúrógépóöőúüű])/g, (m, p1, p2) => p1 + p2.toUpperCase());

            if (!/[.!?]/.test(cleaned)) {

    <title>Tanulási Modell - Átfedésmentes Fraktál &amp; Kombinatorikus Szimuláció</title>
    <style>
        :root {
            --bg-color: #060913;
            --panel-bg: rgba(15, 23, 42, 0.92);
            --primary: #38bdf8;
            --secondary: #818cf8;
            --accent: #f43f5e;
            --vector-color: #34d399;
            --rope-color: #fbbf24;
            --sub-color: #a78bfa;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 12px 24px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .header-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .quote {
            font-size: 1.05rem;
            font-weight: 600;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: italic;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .config-panel {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .config-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .config-item input {
            width: 55px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 5px 8px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            outline: none;
        }

        main {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .status-header-bar {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            z-index: 10;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .phase-indicator {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .status-title {
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .status-desc {
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-muted);
        }

        .canvas-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .math-side-panel {
            width: 340px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 15;
            backdrop-filter: blur(16px);
            overflow-y: auto;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.4);
        }

        .math-panel-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .math-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .math-card.active {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.08);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }

        .math-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .math-card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--secondary);
        }

        .math-val {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--vector-color);
        }

        .math-formula {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 6px;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .math-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--border);
            z-index: 20;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--vector-color), var(--accent));
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <div class="quote">„Az ismétlés a tudás anyja, a szorgalom a tudás apja.”</div>
            <div class="subtitle">Belső elméleti apró kockák kinyílása, független vektorok, permutációk és variábilis lecsüngő sorok</div>
        </div>
        
        <div class="config-panel">
            <div class="config-item">
                <label for="theoryCount">Elméletek (n):</label>
                <input type="number" id="theoryCount" value="4" min="2" max="6" onchange="updateTheoryCount(this.value)">
            </div>
        </div>
    </header>

    <main>
        <div id="canvas-container">
            <div class="status-header-bar">
                <div class="phase-indicator" id="phase-tag">FÁZIS 4 / 6: PERMUTÁCIÓK &amp; VÉLETLEN ÉLEK</div>
                <div class="status-title" id="status-title">4. Permutációs Összefüggések Tetszőleges Sorrendben</div>
                <div class="status-desc" id="status-desc">A vektorelemek között véletlenszerűen alakulnak ki a kapcsolódási élek, szimulálva a permutációkat.</div>
            </div>

            <div class="canvas-wrapper">
                <canvas id="simCanvas" width="1188" height="644"></canvas>
            </div>
        </div>

        <div class="math-side-panel">
            <div class="math-panel-title">
                <span>🧮 Matematikai Háttér</span>
            </div>

            <div class="math-card" id="card-inner">
                <div class="math-card-header">
                    <span class="math-card-title">1. Belső Elemek (Struktúra)</span>
                    <span class="math-val" id="val-inner">E_i = {e_{i,j}}</span>
                </div>
                <div class="math-formula">E_i \\supset \\{e_{i,1}, e_{i,2}, ...\\}</div>
                <div class="math-desc">A fő elméleti kockák magukban foglalják a bal alsó sarokból kibontakozó apró komponenseket.</div>
            </div>

            <div class="math-card" id="card-discrete">
                <div class="math-card-header">
                    <span class="math-card-title">2. Diszkrét Halmaz</span>
                    <span class="math-val" id="val-discrete">n = 4</span>
                </div>
                <div class="math-formula">S = { E₁, E₂, ..., Eₙ }</div>
                <div class="math-desc">Különálló feladatelemek és elmélet-komponensek halmaza. Nincs kapcsolat.</div>
            </div>

            <div class="math-card" id="card-vector">
                <div class="math-card-header">
                    <span class="math-card-title">3. Vektortér (Összefüggés nélkül)</span>
                    <span class="math-val" id="val-vector">dim = 4</span>
                </div>
                <div class="math-formula"><b>v</b> = (v₁, v₂, ..., vₙ)ᵀ</div>
                <div class="math-desc">Az elemek vektorelemmé alakulnak egy sormásolatban – még mindig teljesen függetlenül.</div>
            </div>

            <div class="math-card active" id="card-perm">
                <div class="math-card-header">
                    <span class="math-card-title">4. Permutációk (Véletlen Élek)</span>
                    <span class="math-val" id="val-perm">P = 24</span>
                </div>
                <div class="math-formula">Pₙ = n!</div>
                <div class="math-desc">Véletlenszerű kapcsolatok alakulnak ki. A lehetséges sorrendek száma: <b>n!</b>.</div>
            </div>

            <div class="math-card" id="card-sub-equal">
                <div class="math-card-header">
                    <span class="math-card-title">5. Egyenlő Számosságú Sorok</span>
                    <span class="math-val">k₁ = k₂ = ... = kₙ</span>
                </div>
                <div class="math-formula">|E_i| = k \\quad \\forall i</div>
                <div class="math-desc">A kibontott belső elemek lecsúsznak egymás alá egyenlő hosszúságú sorokba.</div>
            </div>

            <div class="math-card" id="card-sub-var">
                <div class="math-card-header">
                    <span class="math-card-title">6. Eltérő Számosságú Fa</span>
                    <span class="math-val">k₁ ≠ k₂ ≠ k₃</span>
                </div>
                <div class="math-formula">|E_i| = k_i \\quad \\text{(Változó)}</div>
                <div class="math-desc">Az alfeladatok száma igazodik a modulok eltérő komplexitásához.</div>
            </div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar" style="width: 49.3397%;"></div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const progressBar = document.getElementById('progressBar');
        const canvasWrapper = document.querySelector('.canvas-wrapper');

        let numTheories = 4;
        const TOTAL_DURATION = 36000;
        let startTime = null;

        const subCountsPattern = [3, 1, 4, 2, 3, 2];

        function updateTheoryCount(val) {
            numTheories = Math.max(2, Math.min(6, parseInt(val) || 4));
            startTime = null;
        }

        function resizeCanvas() {
            canvas.width = canvasWrapper.clientWidth;
            canvas.height = canvasWrapper.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function factorial(n) {
            return n <= 1 ? 1 : n * factorial(n - 1);
        }

        const phases = [
            {
                start: 0,
                end: 0.16,
                tag: "FÁZIS 1 / 6: BELSŐ APRÓ KOCKÁK",
                title: "1. Belső Apró Elméleti Kockák A Bal Alsó Sarokban",
                desc: "Minden nagy elmélet kockájának bal alsó sarkában megjelenik egy apró belső elméleti kocka, majd több apró kockává sokszorozódik.",
                activeCard: "card-inner"
            },
            {
                start: 0.16,
                end: 0.32,
                tag: "FÁZIS 2 / 6: DISZKRÉT ALAPELEMEK",
                title: "2. Különálló Elméleti Komponensek",
                desc: "A nagy elméleti kockák diszkrét, független feladatelemekként jelennek meg a felső sorban.",
                activeCard: "card-discrete"
            },
            {
                start: 0.32,
                end: 0.48,
                tag: "FÁZIS 3 / 6: FÜGGETLEN VEKTORELEMEK",
                title: "3. Új Sor: Vektorelemek (Kapcsolat nélkül)",
                desc: "Lefut egy új sormásolat: a komponensek különálló vektorelemekké alakulnak, még mindig függetlenül.",
                activeCard: "card-vector"
            },
            {
                start: 0.48,
                end: 0.66,
                tag: "FÁZIS 4 / 6: PERMUTÁCIÓK & VÉLETLEN ÉLEK",
                title: "4. Permutációs Összefüggések Tetszőleges Sorrendben",
                desc: "A vektorelemek között véletlenszerűen alakulnak ki a kapcsolódási élek, szimulálva a permutációkat.",
                activeCard: "card-perm"
            },
            {
                start: 0.66,
                end: 0.83,
                tag: "FÁZIS 5 / 6: EGYENLŐ SZÁMOSSÁGÚ LECSÚSZÓ SOROK",
                title: "5. Belső Elemek Lecsúszása (Egyenlő Számosság)",
                desc: "A bal alsó apró kockák kinyílnak és lecsúsznak a komponensek alá – először teljesen EGYENLŐ számosságú sorokba.",
                activeCard: "card-sub-equal"
            },
            {
                start: 0.83,
                end: 1.0,
                tag: "FÁZIS 6 / 6: VÁLTOZÓ SZÁMOSSÁGÚ LECSÚSZÓ SOROK",
                title: "6. Lecsúszó Sorok VÁLTOZÓ Számossággal",
                desc: "A lecsüngő alfeladat-sorok átalakulnak VÁLTOZÓ számosságúvá, igazodva a modulok egyedi komplexitásához.",
                activeCard: "card-sub-var"
            }
        ];

        function drawSquare(x, y, size, label, type = 'default', opacity = 1, innerProgress = 0) {
            ctx.save();
            ctx.globalAlpha = opacity;
            
            if (type === 'vector') {
                ctx.fillStyle = 'rgba(52, 211, 153, 0.15)';
                ctx.strokeStyle = '#34d399';
            } else if (type === 'sub') {
                ctx.fillStyle = 'rgba(167, 139, 250, 0.15)';
                ctx.strokeStyle = '#a78bfa';
            } else {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
                ctx.strokeStyle = '#38bdf8';
            }
            
            ctx.lineWidth = type === 'sub' ? 1.5 : 2.5;

            ctx.beginPath();
            ctx.roundRect(x - size/2, y - size/2, size, size, type === 'sub' ? 4 : 8);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = type === 'vector' ? '#a7f3d0' : (type === 'sub' ? '#ddd6fe' : '#f8fafc');
            ctx.font = type === 'sub' ? '10px monospace' : (type === 'vector' ? 'bold 11px monospace' : 'bold 12px sans-serif');
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x, y);

            if (innerProgress > 0 && type === 'default') {
                const miniSize = size * 0.22;
                const margin = 4;
                const startX = x - size/2 + margin + miniSize/2;
                const startY = y + size/2 - margin - miniSize/2;

                ctx.fillStyle = 'rgba(244, 63, 94, 0.7)';
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(startX - miniSize/2, startY - miniSize/2, miniSize, miniSize, 2);
                ctx.fill();
                ctx.stroke();

                if (innerProgress > 0.5) {
                    const extraCount = Math.floor((innerProgress - 0.5) * 4) + 1;
                    for (let m = 1; m <= extraCount; m++) {
                        const mX = startX + m * (miniSize + 2);
                        if (mX < x + size/2 - margin) {
                            ctx.fillStyle = 'rgba(251, 191, 36, 0.7)';
                            ctx.strokeStyle = '#fbbf24';
                            ctx.beginPath();
                            ctx.roundRect(mX - miniSize/2, startY - miniSize/2, miniSize, miniSize, 2);
                            ctx.fill();
                            ctx.stroke();
                        }
                    }
                }
            }

            ctx.restore();
        }

        function drawAnimatedLine(p1, p2, progress, color = '#38bdf8', dashed = false) {
            if (progress <= 0) return;
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            if (dashed) ctx.setLineDash([4, 4]);

            const curX = p1.x + (p2.x - p1.x) * Math.min(1, progress);
            const curY = p1.y + (p2.y - p1.y) * Math.min(1, progress);

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(curX, curY);
            ctx.stroke();
            ctx.restore();
        }

        function render(timestamp) {
            if (!startTime) startTime = timestamp;
            let elapsed = timestamp - startTime;
            let globalProgress = (elapsed % TOTAL_DURATION) / TOTAL_DURATION;

            progressBar.style.width = (globalProgress * 100) + '%';

            const width = canvas.width;
            const height = canvas.height;
            const padding = width / (numTheories + 1);

            const mainSquareSize = Math.min(54, padding * 0.48);
            const subSquareSize = Math.min(24, mainSquareSize * 0.5);

            const row1Y = height * 0.16;
            const row2Y = height * 0.36;

            const currentPhase = phases.find(p => globalProgress >= p.start && globalProgress <= p.end) || phases[5];
            document.getElementById('phase-tag').innerText = currentPhase.tag;
            document.getElementById('status-title').innerText = currentPhase.title;
            document.getElementById('status-desc').innerText = currentPhase.desc;

            document.querySelectorAll('.math-card').forEach(card => card.classList.remove('active'));
            const activeCardEl = document.getElementById(currentPhase.activeCard);
            if (activeCardEl) activeCardEl.classList.add('active');

            document.getElementById('val-discrete').innerText = \`n = \${numTheories}\`;
            document.getElementById('val-vector').innerText = \`dim = \${numTheories}\`;
            document.getElementById('val-perm').innerText = \`P = \${factorial(numTheories)}\`;

            ctx.clearRect(0, 0, width, height);

            const theoryPositions = [];
            for (let i = 0; i < numTheories; i++) {
                theoryPositions.push({ x: padding * (i + 1), y: row1Y });
            }

            let innerProg = 0;
            if (globalProgress <= 0.16) {
                innerProg = globalProgress / 0.16;
            } else {
                innerProg = 1;
            }

            theoryPositions.forEach((pos, i) => {
                drawSquare(pos.x, pos.y, mainSquareSize, \`E\${i+1}\`, 'default', 1, innerProg);
            });

            if (globalProgress > 0.32) {
                const copyProgress = (globalProgress - 0.32) / 0.16;

                ctx.save();
                ctx.strokeStyle = 'rgba(52, 211, 153, 0.35)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(padding * 0.3, row2Y - mainSquareSize * 0.65, width - padding * 0.6, mainSquareSize * 1.3);
                
                ctx.fillStyle = '#34d399';
                ctx.font = '11px monospace';
                ctx.fillText('VEKTORTÉR (MÉG KAPCSOLAT NÉLKÜLI FÜGGETLEN ELEMEK)', padding * 0.3 + 10, row2Y - mainSquareSize * 0.65 - 6);
                ctx.restore();

                theoryPositions.forEach((pos, i) => {
                    const itemProgress = Math.min(1, Math.max(0, (copyProgress * 2) - (i * 0.1)));
                    if (itemProgress > 0) {
                        const currentY = pos.y + (row2Y - pos.y) * itemProgress;
                        drawAnimatedLine({ x: pos.x, y: pos.y + mainSquareSize/2 }, { x: pos.x, y: currentY - mainSquareSize/2 }, 1, 'rgba(52, 211, 153, 0.3)', true);
                        drawSquare(pos.x, currentY, mainSquareSize, \`v[\${i+1}]\`, 'vector', itemProgress);
                    }
                });
            }

            if (globalProgress > 0.48) {
                const permProgress = (globalProgress - 0.48) / 0.18;

                const randomConnections = [
                    { from: 0, to: Math.min(2, numTheories - 1) },
                    { from: 1, to: Math.min(3, numTheories - 1) },
                    { from: 0, to: Math.min(1, numTheories - 1) }
                ];

                randomConnections.forEach((link, idx) => {
                    const p = Math.min(1, Math.max(0, permProgress * 2.5 - idx * 0.25));
                    if (p > 0 && link.from !== link.to) {
                        const p1 = { x: theoryPositions[link.from].x, y: row2Y + mainSquareSize/2 };
                        const p2 = { x: theoryPositions[link.to].x, y: row2Y + mainSquareSize/2 };
                        
                        ctx.save();
                        ctx.strokeStyle = '#f43f5e';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([4, 4]);

                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        const arcHeight = row2Y + mainSquareSize + 20 + (idx * 14);
                        const curX = p1.x + (p2.x - p1.x) * p;
                        const curY = p1.y + (p2.y - p1.y) * p;

                        ctx.quadraticCurveTo((p1.x + p2.x)/2, arcHeight, curX, curY);
                        ctx.stroke();
                        ctx.restore();
                    }
                });
            }

            if (globalProgress > 0.66 && globalProgress <= 0.83) {
                const slideProgress = (globalProgress - 0.66) / 0.17;
                const equalCount = 3;

                theoryPositions.forEach((pos, i) => {
                    const gap = 8;
                    const startY = row2Y + mainSquareSize + 30;

                    for (let j = 0; j < equalCount; j++) {
                        const targetY = startY + j * (subSquareSize + gap);
                        const itemProgress = Math.min(1, Math.max(0, slideProgress * 3 - (j * 0.2)));

                        if (itemProgress > 0) {
                            const sourceX = pos.x - mainSquareSize/3;
                            const sourceY = pos.y + mainSquareSize/3;

                            const animX = sourceX + (pos.x - sourceX) * itemProgress;
                            const animY = sourceY + (targetY - sourceY) * itemProgress;

                            drawAnimatedLine({ x: pos.x, y: pos.y + mainSquareSize/2 }, { x: animX, y: animY - subSquareSize/2 }, 1, '#a78bfa', true);
                            drawSquare(animX, animY, subSquareSize, \`e\${i+1}.\${j+1}\`, 'sub', itemProgress);
                        }
                    }
                });
            }

            if (globalProgress > 0.83) {
                const varProgress = (globalProgress - 0.83) / 0.17;

                theoryPositions.forEach((pos, i) => {
                    const varCount = subCountsPattern[i % subCountsPattern.length];
                    const gap = 8;
                    const startY = row2Y + mainSquareSize + 30;

                    for (let j = 0; j < varCount; j++) {
                        const targetY = startY + j * (subSquareSize + gap);
                        const itemProgress = Math.min(1, Math.max(0, varProgress * 3 - (j * 0.15)));

                        if (itemProgress > 0) {
                            drawAnimatedLine({ x: pos.x, y: pos.y + mainSquareSize/2 }, { x: pos.x, y: targetY - subSquareSize/2 }, 1, '#f43f5e', true);
                            drawSquare(pos.x, targetY, subSquareSize, \`v\${i+1}.\${j+1}\`, 'sub', itemProgress);
                        }
                    }
                });
            }

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);

    <script>

        const phaseTag = document.getElementById('phase-tag');

        let startTime = null;

        function updateTheoryCount(val) {

                desc: "Megadott számú különálló, egyetlen komponensből álló elmélet jön létre a képernyőn.",
                speech: "Az egy-egy komponensből álló elmélet, elmélet, elmélet sorból kiindulunk."
            },
            {

                tag: "FÁZIS 2 / 5: VEKTORMÁSOLAT KÉPZÉS",
                title: "2. Másolat Sor & Vektorképzés",
                desc: "Az elméletek soráról egy új sort (másolatot) képezünk. Így hozzuk létre a vektor elemeit képező struktúrát.",
                speech: "Ebből az elmélet sorból képezünk egy új sort, egy másolatot, amely a vektor elemeit alkotja."
            },
            {
                start: 0.45,
                end: 0.68,
                tag: "FÁZIS 3 / 5: ÖSSZEFÜGGÉSEK HÁLÓZATA",
                title: "3. Összefüggések Képzése",
                desc: "A vektorelemek és az eredeti elmélet-komponensek között összekötő vonalakkal relációk és függőségek jönnek létre.",
                speech: "A vektor elemeiből most képezzük az összefüggéseket animált élekkel."
            },
            {
                start: 0.68,
                end: 0.85,
                tag: "FÁZIS 4 / 5: DEKOMPOZÍCIÓ",
                title: "4. Lecsüngő Sorok (Alfeladatok)",
                desc: "Az elméleti komponensek alfeladatokra bomlanak, és függőlegesen lecsüngő sorokat képeznek.",
                speech: "Az elméletek alfeladatokra bonthatók, lecsüngő sorokat képezve."
            },
            {
                start: 0.85,
                end: 1.0,
                tag: "FÁZIS 5 / 5: SZÁRÍTÓKÖTÉL METAFAORA",
                title: "5. Permutációs Szárítókötél",
                desc: "Az elemek felkerülnek az idővonal szárítókötelére, ahol tetszőleges variációkban összeköthetők.",
                speech: "A teljes szerkezet a szárítókötélre kerül, kombinálható és permutálható relációkkal."
            }

        function drawSquare(x, y, size, label, isVector = false, isSub = false, opacity = 1) {

            const height = canvas.height;

                ctx.save();

                    if (itemProgress > 0) {

                for (let i = 0; i < numTheories - 1; i++) {

                }
            }

            // --- 4. FÁZIS: Lecsüngő Sorok (Alfeladatok) ---
            if (globalProgress > 0.68) {
                const subProgress = (globalProgress - 0.68) / 0.17;

                theoryPositions.forEach((pos, i) => {
                    const subCount = 2 + (i % 2); // 2 vagy 3 alfeladat
                    const subSize = 30;
                    const gap = 12;

                    for (let j = 0; j < subCount; j++) {
                        const targetY = row2Y + 75 + j * (subSize + gap);
                        const itemProgress = Math.min(1, Math.max(0, subProgress * 3 - (j * 0.3)));

                        if (itemProgress > 0) {
                            const lineStart = j === 0 ? { x: pos.x, y: row2Y + 32 } : { x: pos.x, y: targetY - subSize - gap/2 };
                            const lineEnd = { x: pos.x, y: targetY - subSize/2 };

                            drawSquare(pos.x, targetY, subSize, \`e\${i+1}.\${j+1}\`, false, true, itemProgress);

                    }
                });
            }

            if (globalProgress > 0.85) {

                ctx.save();
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 3;
                ctx.beginPath();

                ctx.stroke();

                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('SZÁRÍTÓKÖTÉL (IDŐVONAL & RELÁCIÓS FELFÜGGESZTÉS)', width / 2, ropeY - 10);

                    ctx.fillStyle = '#f43f5e';
                    ctx.fillRect(pos.x - 3, ropeY + 5, 6, 15);

            }

            requestAnimationFrame(render);
        }
