<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligens Python Script Generátor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 0.75rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
        }

        input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-browse {
            background-color: #475569;
            color: white;
            border: none;
            padding: 0 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .btn-browse:hover {
            background-color: #64748b;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 1rem;
            transition: background 0.2s;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Python Script Generátor</h1>
        
        <div class="form-group">
            <label for="projectName">Project Name (Vercel):</label>
            <input type="text" id="projectName" value="red-zeta-one" placeholder="pl. red-zeta-one">
        </div>

        <div class="form-group">
            <label for="mainFolder">Fő mappa neve:</label>
            <div class="input-row">
                <input type="text" id="mainFolder" value="tabla" placeholder="pl. tabla" oninput="syncSubFolder(this.value)">
                <button class="btn-browse" onclick="pickFolder()">📁 Tallózás</button>
            </div>
        </div>

        <div class="form-group">
            <label for="subFolderPrefix">Almappák előtagja:</label>
            <input type="text" id="subFolderPrefix" value="tabla" placeholder="pl. tabla">
        </div>

        <button class="btn" onclick="downloadPythonScript()">📥 r5.py Letöltése</button>
    </div>

    <script>
        // Automatikusan szinkronizálja az almappa előtagot a fő mappával
        function syncSubFolder(val) {
            document.getElementById('subFolderPrefix').value = val;
        }

        // Böngészős mappaválasztó (Chrome / Edge / Opera támogatással)
        async function pickFolder() {
            try {
                const handle = await window.showDirectoryPicker();
                const folderName = handle.name;
                document.getElementById('mainFolder').value = folderName;
                document.getElementById('subFolderPrefix').value = folderName;
            } catch (err) {
                console.log('Mappaválasztás megszakítva:', err);
            }
        }

        function downloadPythonScript() {
            const projectName = document.getElementById('projectName').value.trim() || "red-zeta-one";
            const mainFolder = document.getElementById('mainFolder').value.trim() || "tabla";
            const subFolderPrefix = document.getElementById('subFolderPrefix').value.trim() || "tabla";

            const pythonCode = `import os
import shutil
import tkinter as tk
from tkinter import filedialog

# --- BEÁLLÍTÁSOK (Webes felületről megadva) ---
PROJECT_NAME = "${projectName}" 
BASE_VERCEL_URL = f"https://{PROJECT_NAME}.vercel.app"
OUTPUT_MAIN_FOLDER = "${mainFolder}"
SUBFOLDER_PREFIX = "${subFolderPrefix}"

def auto_process():
    # Ablak elrejtése a tkinter-hez
    root = tk.Tk()
    root.withdraw()

    print("Kérlek, válaszd ki a mentési mappát...")
    # Mentési/Célmappa kiválasztó ablak futtatáskor
    target_directory = filedialog.askdirectory(title=f"Hová mentsem a(z) '{OUTPUT_MAIN_FOLDER}' mappát?")

    if not target_directory:
        print("Művelet megszakítva: Nem lett mentési hely kiválasztva.")
        return

    # Fő mappa teljes útvonala a kiválasztott helyen belül
    output_main_path = os.path.join(target_directory, OUTPUT_MAIN_FOLDER)

    if not os.path.exists(output_main_path):
        os.makedirs(output_main_path)
        print(f"Létrehozva a fő mappa: '{output_main_path}'")

    generated_links = []
    counter = 1

    for filename in os.listdir("."):
        if filename.endswith(".html") and filename != "r5.py":
            subfolder_name = f"{SUBFOLDER_PREFIX}{counter}"
            counter += 1

            subfolder_path = os.path.join(output_main_path, subfolder_name)
            if not os.path.exists(subfolder_path):
                os.makedirs(subfolder_path)

            destination_file = os.path.join(subfolder_path, "index.html")
            
            shutil.copy(filename, destination_file)
            print(f"Feldolgozva: {filename} -> {output_main_path}/{subfolder_name}/index.html")

            link = f"{BASE_VERCEL_URL}/{OUTPUT_MAIN_FOLDER}/{subfolder_name}"
            generated_links.append(link)

    print("\\n" + "="*50)
    print(" SIKERES FELDOLGOZÁS! Másold ki az alábbi linkeket:")
    print("="*50 + "\\n")
    
    print("\\n".join(generated_links))
    print("\\n" + "="*50)

if __name__ == "__main__":
    auto_process()
`;

            const blob = new Blob([pythonCode], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'r5.py';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
