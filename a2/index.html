<html lang="hu"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>Varázskréta - Törölhető Tábla &amp; Rózsaszín Szemüveg</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #334155;
            max-width: 950px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            color: #38bdf8;
            text-align: center;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #38bdf8; color: #0f172a; }
        button.mode-btn { background: #ec4899; }
        button.mode-btn:hover { background: #f472b6; color: white; }
        button.reset { background: #ef4444; }
        button.reset:hover { background: #f87171; color: white; }

        .board-wrapper {
            position: relative;
            width: 100%;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #475569;
            cursor: crosshair;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .status {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            color: #94a3b8;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ Varázskréta (Interaktív Radír &amp; Rózsaszín Szemüveg)</h2>
    
    <div class="controls">
        <button onclick="runAutoAnimation()">▶ Automatikus Animáció</button>
        <button class="mode-btn" id="modeBtn" onclick="toggleMode()" style="background: rgb(236, 72, 153);">✏️ Mód: Kréta (Írás)</button>
        <button class="reset" onclick="resetBoard()">🔄 Tábla Törlése</button>
    </div>

    <div class="board-wrapper">
        <canvas id="mainCanvas" width="950" height="480"></canvas>
    </div>

    <div class="status" id="statusText">Tartsd lenyomva az egeret a táblán az íráshoz!</div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

let width, height;
let maskCanvas, maskCtx;
let formulaCanvas, formulaCtx;
let isAutoRunning = false;
let autoTimer = null;

let currentMode = 'draw'; // 'draw' (írás) vagy 'erase' (törlés)

let teacherHandX = 0;
let teacherHandY = 0;

function initCanvas() {
    width = canvas.width = canvas.offsetWidth;
    height = canvas.height = canvas.offsetHeight;

    formulaCanvas = document.createElement('canvas');
    formulaCanvas.width = width;
    formulaCanvas.height = height;
    formulaCtx = formulaCanvas.getContext('2d');
    drawFormulasAndPhysics();

    maskCanvas = document.createElement('canvas');
    maskCanvas.width = width;
    maskCanvas.height = height;
    maskCtx = maskCanvas.getContext('2d');
    resetBoard();
}

function drawFormulasAndPhysics() {
    formulaCtx.fillStyle = '#064e3b'; // Sötétzöld retró tábla
    formulaCtx.fillRect(0, 0, width, height);

    formulaCtx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    formulaCtx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
    formulaCtx.font = '18px "Courier New", monospace';
    formulaCtx.lineWidth = 2;

    const startX = width * 0.32;

    // 1D Tömbök
    formulaCtx.fillText("int arr[5] = {12, 45, 8, 99, 3};", startX, 45);
    
    let boxX = startX;
    let boxY = 60;
    const values = ["12", "45", "8", "99", "3"];
    for(let i = 0; i < 5; i++) {
        formulaCtx.strokeRect(boxX + i * 45, boxY, 45, 30);
        formulaCtx.fillText(values[i], boxX + i * 45 + 12, boxY + 22);
        formulaCtx.font = '12px "Courier New", monospace';
        formulaCtx.fillText(`[${i}]`, boxX + i * 45 + 14, boxY + 45);
        formulaCtx.font = '18px "Courier New", monospace';
    }

    formulaCtx.fillText("ptr = &arr[0];  *ptr = 12", startX, 135);

    // Fizikai képletek
    formulaCtx.fillText("F = m · a   |   E_k = 1/2 · m · v²", startX, 180);
    formulaCtx.fillText("λ = v / f   |   p = m · v", startX, 215);

    // Rugó-tömeg rendszer
    let springX = startX + 20;
    let springY = 250;
    formulaCtx.beginPath();
    formulaCtx.moveTo(springX, springY);
    for(let i=0; i<6; i++) {
        springX += (i % 2 === 0 ? 10 : -10);
        springY += 8;
        formulaCtx.lineTo(springX, springY);
    }
    formulaCtx.lineTo(startX + 20, springY + 10);
    formulaCtx.stroke();

    formulaCtx.strokeRect(startX + 5, springY + 10, 30, 25);
    formulaCtx.fillText("m", startX + 13, springY + 28);
    formulaCtx.fillText("k", startX + 35, springY - 15);

    // Áramkör elem (R)
    let resX = startX + 180;
    let resY = 280;
    formulaCtx.beginPath();
    formulaCtx.moveTo(resX, resY);
    formulaCtx.lineTo(resX + 20, resY);
    formulaCtx.strokeRect(resX + 20, resY - 10, 40, 20);
    formulaCtx.moveTo(resX + 60, resY);
    formulaCtx.lineTo(resX + 80, resY);
    formulaCtx.stroke();
    formulaCtx.fillText("R = 50 Ω", resX + 10, resY - 18);

    formulaCtx.fillText("U = I · R   |   P = U · I", startX, 345);
    formulaCtx.fillText("T = 2π √(m / k)", startX, 385);
    formulaCtx.fillText("v(t) = v₀ + a·t", startX, 425);
}

function resetBoard() {
    isAutoRunning = false;
    clearTimeout(autoTimer);
    
    // Alapértelmezetten a sötét lepel takarja a táblát
    maskCtx.globalCompositeOperation = 'source-over';
    maskCtx.fillStyle = '#0f172a';
    maskCtx.fillRect(0, 0, width, height);
    
    teacherHandX = width * 0.32;
    teacherHandY = height * 0.45;
    
    render();
}

function toggleMode() {
    const btn = document.getElementById('modeBtn');
    const status = document.getElementById('statusText');

    if (currentMode === 'draw') {
        currentMode = 'erase';
        btn.innerHTML = '🧽 Mód: Szivacs (Törlés)';
        btn.style.background = '#f59e0b';
        status.innerText = 'Húzd az egeret a táblán, hogy letöröld a krétát (visszatakarás)!';
    } else {
        currentMode = 'draw';
        btn.innerHTML = '✏️ Mód: Kréta (Írás)';
        btn.style.background = '#ec4899';
        status.innerText = 'Tartsd lenyomva az egeret a táblán az íráshoz!';
    }
}

function handleBoardInteraction(x, y, radius = 50) {
    maskCtx.save();
    
    if (currentMode === 'draw') {
        // Írás: Letörli a fekete maszkot -> feltárul a krétarajz
        maskCtx.globalCompositeOperation = 'destination-out';
        let grad = maskCtx.createRadialGradient(x, y, 5, x, y, radius);
        grad.addColorStop(0, 'rgba(0, 0, 0, 1)');
        grad.addColorStop(0.75, 'rgba(0, 0, 0, 0.85)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        maskCtx.fillStyle = grad;
        maskCtx.beginPath();
        maskCtx.arc(x, y, radius, 0, Math.PI * 2);
        maskCtx.fill();
    } else {
        // Törlés (Szivacs): Visszafesti a sötét maszkot -> eltakarja a krétát
        maskCtx.globalCompositeOperation = 'source-over';
        let grad = maskCtx.createRadialGradient(x, y, 5, x, y, radius);
        grad.addColorStop(0, '#0f172a');
        grad.addColorStop(0.8, '#0f172a');
        grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
        maskCtx.fillStyle = grad;
        maskCtx.beginPath();
        maskCtx.arc(x, y, radius, 0, Math.PI * 2);
        maskCtx.fill();
    }
    
    maskCtx.restore();

    teacherHandX = x;
    teacherHandY = y;

    render();
}

// RETRÓ TANÁRNŐ (NAGY RÓZSASZÍN SZEMÜVEGGEL)
function drawRetroTeacher(targetX, targetY) {
    ctx.save();

    const shoulderX = width * 0.15;
    const shoulderY = height * 0.48;

    // 1. CERUZASZOKNYA
    ctx.fillStyle = '#1e1b4b';
    ctx.beginPath();
    ctx.moveTo(width * 0.08, height * 0.72);
    ctx.lineTo(width * 0.16, height * 0.72);
    ctx.lineTo(width * 0.145, height);
    ctx.lineTo(width * 0.09, height);
    ctx.closePath();
    ctx.fill();

    // 2. RETRÓ KOSZTÜMKABÁT (Bordó)
    ctx.fillStyle = '#881337';
    ctx.beginPath();
    ctx.moveTo(0, height * 0.78);
    ctx.lineTo(width * 0.165, height * 0.74);
    ctx.lineTo(width * 0.125, height * 0.58);
    ctx.lineTo(shoulderX + 18, shoulderY);
    ctx.lineTo(width * 0.10, height * 0.42);
    ctx.lineTo(0, height * 0.50);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#4c0519';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Hajtókák
    ctx.fillStyle = '#9f1239';
    ctx.beginPath();
    ctx.moveTo(width * 0.10, height * 0.42);
    ctx.lineTo(width * 0.13, height * 0.52);
    ctx.lineTo(width * 0.11, height * 0.53);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Gombok
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(width * 0.13, height * 0.60, 3.5, 0, Math.PI * 2);
    ctx.arc(width * 0.138, height * 0.66, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // 3. SELYEMBLÚZ ÉS CSIPKEGALLÉR
    ctx.fillStyle = '#fff7ed';
    ctx.beginPath();
    ctx.moveTo(width * 0.105, height * 0.41);
    ctx.lineTo(width * 0.138, height * 0.41);
    ctx.lineTo(width * 0.122, height * 0.52);
    ctx.fill();

    // Csipkegallér
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(width * 0.114, height * 0.415, 6, 0, Math.PI);
    ctx.arc(width * 0.128, height * 0.415, 6, 0, Math.PI);
    ctx.fill();
    ctx.stroke();

    // Nyaklánc
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(width * 0.121, height * 0.41, 7, 0.2, Math.PI - 0.2);
    ctx.stroke();

    // 4. NYAK ÉS ARC
    ctx.fillStyle = '#fecdd3';
    ctx.fillRect(width * 0.112, height * 0.35, 14, 22);

    ctx.beginPath();
    ctx.ellipse(width * 0.12, height * 0.29, 15, 21, 0, 0, Math.PI * 2);
    ctx.fill();

    // Arcpirosító
    ctx.fillStyle = 'rgba(244, 63, 94, 0.25)';
    ctx.beginPath();
    ctx.arc(width * 0.132, height * 0.30, 4.5, 0, Math.PI * 2);
    ctx.fill();

    // SZEMEK
    let eyeX = width * 0.131;
    let eyeY = height * 0.275;

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(eyeX, eyeY, 3.5, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#78350f';
    ctx.beginPath();
    ctx.arc(eyeX + 0.6, eyeY, 1.8, 0, Math.PI * 2);
    ctx.fill();

    // Mosoly
    ctx.fillStyle = '#be123c';
    ctx.beginPath();
    ctx.arc(width * 0.13, height * 0.318, 3.5, 0.1, Math.PI - 0.1);
    ctx.fill();

    // 5. NAGY OVERSIZED RÓZSASZÍN SZEMÜVEG 👓💖
    ctx.strokeStyle = '#ec4899'; // Élénk rózsaszín keret
    ctx.lineWidth = 3;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)'; // Enyhe üvegcsillogás

    // Nagy kerek keret
    ctx.beginPath();
    ctx.roundRect(eyeX - 8, eyeY - 8, 18, 16, 5);
    ctx.fill();
    ctx.stroke();

    // Belső vékony rózsaszín kiemelés
    ctx.strokeStyle = '#f472b6';
    ctx.lineWidth = 1;
    ctx.strokeRect(eyeX - 7, eyeY - 7, 16, 14);

    // Szemüveg szár & orrhíd
    ctx.strokeStyle = '#ec4899';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(eyeX - 8, eyeY - 2);
    ctx.lineTo(eyeX - 14, eyeY - 4); // Szár
    ctx.stroke();

    // Csillogás a lencsén
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(eyeX - 4, eyeY - 5);
    ctx.lineTo(eyeX + 4, eyeY + 3);
    ctx.stroke();

    // 6. FRIZURA
    ctx.fillStyle = '#271c19';
    ctx.beginPath();
    ctx.arc(width * 0.11, height * 0.27, 22, Math.PI * 0.4, Math.PI * 2.1);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(width * 0.12, height * 0.235, 16, Math.PI * 1.1, Math.PI * 1.85);
    ctx.fill();

    // 7. DINAMIKUS KAR ÉS KRÉTA / SZIVACS
    let midX = (shoulderX + targetX) / 2 - 10;
    let midY = (shoulderY + targetY) / 2 + 15;

    ctx.strokeStyle = '#881337';
    ctx.lineWidth = 17;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY);
    ctx.quadraticCurveTo(midX, midY, targetX, targetY);
    ctx.stroke();

    // Mandzsetta
    ctx.strokeStyle = '#4c0519';
    ctx.lineWidth = 19;
    ctx.beginPath();
    ctx.moveTo(targetX - 6, targetY - 2);
    ctx.lineTo(targetX - 1, targetY);
    ctx.stroke();

    // Kézfej
    ctx.fillStyle = '#fecdd3';
    ctx.beginPath();
    ctx.arc(targetX, targetY, 6, 0, Math.PI * 2);
    ctx.fill();

    // Eszköz a kézben: Kréta vagy Szivacs a módtól függően
    if (currentMode === 'draw') {
        // Fehér kréta
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'white';
        ctx.shadowBlur = 8;
        ctx.fillRect(targetX - 2, targetY - 4, 14, 4.5);
        ctx.shadowBlur = 0;
    } else {
        // Sárga retró szivacs
        ctx.fillStyle = '#f59e0b';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 6;
        ctx.fillRect(targetX - 5, targetY - 8, 16, 12);
        ctx.shadowBlur = 0;
    }

    ctx.restore();
}

function render() {
    ctx.drawImage(formulaCanvas, 0, 0);
    ctx.drawImage(maskCanvas, 0, 0);
    drawRetroTeacher(teacherHandX, teacherHandY);
}

// Egér és Touch eseménykezelők
let isInteracting = false;

canvas.addEventListener('mousedown', (e) => { isInteracting = true; handleEvent(e); });
canvas.addEventListener('mousemove', (e) => { if (isInteracting) handleEvent(e); });
window.addEventListener('mouseup', () => isInteracting = false);

// Touch támogatás mobilon
canvas.addEventListener('touchstart', (e) => { isInteracting = true; handleEvent(e.touches[0]); });
canvas.addEventListener('touchmove', (e) => { if (isInteracting) handleEvent(e.touches[0]); });
window.addEventListener('touchend', () => isInteracting = false);

function handleEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    handleBoardInteraction(x, y);
}

// Automatikus animáció
function runAutoAnimation() {
    currentMode = 'draw';
    document.getElementById('modeBtn').innerHTML = '✏️ Mód: Kréta (Írás)';
    document.getElementById('modeBtn').style.background = '#ec4899';
    resetBoard();
    isAutoRunning = true;

    let t = 0;
    function animateStep() {
        if (!isAutoRunning) return;

        let startX = width * 0.32;
        let endX = width * 0.88;
        let x = startX + t * (endX - startX);
        let y = height * 0.68 - Math.sin(t * Math.PI) * (height * 0.48);

        handleBoardInteraction(x, y, 65);

        t += 0.009;
        if (t <= 1) {
            autoTimer = setTimeout(animateStep, 20);
        } else {
            isAutoRunning = false;
        }
    }
    animateStep();
}

window.addEventListener('load', () => {
    initCanvas();
    runAutoAnimation();
});
window.addEventListener('resize', initCanvas);
</script>

</body></html>
