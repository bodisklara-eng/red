<html lang="hu"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feladat Létrehozó</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
        }

        .task-box {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 280px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .task-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        /* Kulcs ikon alapstílusa */
        .key-icon {
            width: 60px;
            height: 60px;
            fill: #4a90e2;
            margin-bottom: 15px;
            display: inline-block;
            transform-origin: center center;
            transition: fill 0.3s ease;
        }

        /* Amikor a doboz fölé viszed az egeret, elindul a 3 fordulatos animáció */
        .task-box:hover .key-icon {
            fill: #27ae60; /* Színváltás zöldre */
            animation: spin-three-times 1.5s ease-in-out forwards;
        }

        /* 3 teljes fordulat (360° x 3 = 1080°) */
        @keyframes spin-three-times {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(1080deg);
            }
        }

        .task-box h3 {
            margin: 0 0 10px 0;
            color: #333333;
            font-size: 18px;
            line-height: 1.4;
        }

        .task-box p {
            margin: 0;
            font-size: 14px;
            color: #777777;
        }
    </style>
</head>
<body>
