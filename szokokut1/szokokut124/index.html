<body>

<div class="container">
    <h2>🌊 Varázstábla &amp; Csobbanó Szökőkút</h2>
    
    <div class="controls">
        <button onclick="runAutoAnimation()">▶ Vízpermet Animáció</button>
        <button class="mode-btn" id="modeBtn" onclick="toggleMode()">💧 Mód: Vízpermet (Rajz)</button>
        <button class="reset" onclick="resetBoard()">🔄 Tábla Törlése</button>
    </div>

    <div class="board-wrapper">
        <canvas id="mainCanvas" width="950" height="480"></canvas>
    </div>

    <div class="status" id="statusText">Kattints vagy húzd az egeret a táblán a vízpermethez!</div>

    <!-- MENÜFÜLEK A TOVÁBBI HTML JÁTÉKOKHOZ -->
    <div class="notebook-tabs">
        <a href="file:///C:/Users/Utilizator/Downloads/jatek1.html" class="tab-item tab-1" title="Logikai Játék">🧩 Logika</a>
        <a href="file:///C:/Users/Utilizator/Downloads/jatek2.html" class="tab-item tab-2" title="Kód Kvíz">💻 Kód Kvíz</a>
        <a href="file:///C:/Users/Utilizator/Downloads/jatek3.html" class="tab-item tab-3" title="Számrejtvény">🔢 Rejtvény</a>
    </div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

let width, height;
let maskCanvas, maskCtx;
let formulaCanvas, formulaCtx;
let isAutoRunning = false;
let autoTimer = null;
let currentMode = 'draw';
let fountainAngle = 0;

function initCanvas() {
    width = canvas.width = canvas.offsetWidth;
    height = canvas.height = canvas.offsetHeight;

    formulaCanvas = document.createElement('canvas');
    formulaCanvas.width = width;
    formulaCanvas.height = height;
    formulaCtx = formulaCanvas.getContext('2d');
    drawFormulasAndPhysics();

    maskCanvas = document.createElement('canvas');
    maskCanvas.width = width;
    maskCanvas.height = height;
    maskCtx = maskCanvas.getContext('2d');
    resetBoard();
}

function drawFormulasAndPhysics() {
    formulaCtx.fillStyle = '#064e3b';
    formulaCtx.fillRect(0, 0, width, height);

    formulaCtx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    formulaCtx.font = '18px "Courier New", monospace';

    const startX = width * 0.30;
    formulaCtx.fillText("Fluid Dynamics: Q = A · v", startX, 50);
    formulaCtx.fillText("Bernoulli: p + ½ρv² + ρgh = const", startX, 90);
    formulaCtx.fillText("Navier-Stokes equations...", startX, 130);

    // Néhány dekoratív képlet
    for(let i=0; i<5; i++) {
        formulaCtx.fillText(`Vízhozam elem #${i+1}: Q_${i} = ${Math.round(Math.random()*100)} L/min`, startX, 180 + i * 40);
    }
}

function resetBoard() {
    isAutoRunning = false;
    clearTimeout(autoTimer);
    maskCtx.globalCompositeOperation = 'source-over';
    maskCtx.fillStyle = '#0f172a';
    maskCtx.fillRect(0, 0, width, height);
    render(width * 0.6, height * 0.5);
}

function toggleMode() {
    const btn = document.getElementById('modeBtn');
    const status = document.getElementById('statusText');

    if (currentMode === 'draw') {
        currentMode = 'erase';
        btn.innerHTML = '🧽 Mód: Szivacs (Törlés)';
        btn.style.background = '#f59e0b';
        status.innerText = 'Töröld le a vízcseppeket a szivaccsal!';
    } else {
        currentMode = 'draw';
        btn.innerHTML = '💧 Mód: Vízpermet (Rajz)';
        btn.style.background = '#06b6d4';
        status.innerText = 'Kattints vagy húzd az egeret a táblán a vízpermethez!';
    }
}

function handleBoardInteraction(x, y, radius = 45) {
    maskCtx.save();
    if (currentMode === 'draw') {
        maskCtx.globalCompositeOperation = 'destination-out';
        let grad = maskCtx.createRadialGradient(x, y, 2, x, y, radius);
        grad.addColorStop(0, 'rgba(0, 0, 0, 1)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        maskCtx.fillStyle = grad;
        maskCtx.beginPath();
        maskCtx.arc(x, y, radius, 0, Math.PI * 2);
        maskCtx.fill();
    } else {
        maskCtx.globalCompositeOperation = 'source-over';
        maskCtx.fillStyle = '#0f172a';
        maskCtx.beginPath();
        maskCtx.arc(x, y, radius, 0, Math.PI * 2);
        maskCtx.fill();
    }
    maskCtx.restore();
    render(x, y);
}

// CSOBBANÓ SZÖKŐKÚT RAJZOLÁSA A BAL OLDALRA
function drawFountain(activeX, activeY) {
    ctx.save();
    
    let fx = width * 0.12;
    let fy = height * 0.75;

    // Szökőkút medence (kő aljzat)
    ctx.fillStyle = '#475569';
    ctx.beginPath();
    ctx.ellipse(fx, fy, 60, 20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Medence belső víz
    ctx.fillStyle = '#0ea5e9';
    ctx.beginPath();
    ctx.ellipse(fx, fy - 3, 50, 14, 0, 0, Math.PI * 2);
    ctx.fill();

    // Szökőkút oszlop
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(fx - 10, fy - 70, 20, 70);

    // Felső tálca
    ctx.beginPath();
    ctx.ellipse(fx, fy - 70, 30, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Központi vízsugár ív (animált)
    fountainAngle += 0.1;
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(fx, fy - 75);
    ctx.quadraticCurveTo(fx + (activeX - fx) / 2, (fy - 150) + Math.sin(fountainAngle) * 15, activeX, activeY);
    ctx.stroke();

    // Vízpermet cseppek a becsapódás helyén
    ctx.fillStyle = '#7dd3fc';
    for(let i = 0; i < 4; i++) {
        let offsetX = (Math.random() - 0.5) * 30;
        let offsetY = (Math.random() - 0.5) * 30;
        ctx.beginPath();
        ctx.arc(activeX + offsetX, activeY + offsetY, Math.random() * 4 + 1, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

function render(x, y) {
    ctx.drawImage(formulaCanvas, 0, 0);
    ctx.drawImage(maskCanvas, 0, 0);
    drawFountain(x, y);
}

// Eseménykezelők
let isInteracting = false;
canvas.addEventListener('mousedown', (e) => { isInteracting = true; handleEvent(e); });
canvas.addEventListener('mousemove', (e) => { if (isInteracting) handleEvent(e); });
window.addEventListener('mouseup', () => isInteracting = false);

function handleEvent(e) {
    const rect = canvas.getBoundingClientRect();
    handleBoardInteraction(e.clientX - rect.left, e.clientY - rect.top);
}

function runAutoAnimation() {
    currentMode = 'draw';
    resetBoard();
    isAutoRunning = true;
    let t = 0;
    function step() {
        if (!isAutoRunning) return;
        let x = width * 0.35 + Math.sin(t) * (width * 0.25) + width * 0.2;
        let y = height * 0.5 + Math.cos(t * 2) * (height * 0.2);
        handleBoardInteraction(x, y, 55);
        t += 0.05;
        if (t < 20) {
            autoTimer = setTimeout(step, 30);
        } else {
            isAutoRunning = false;
        }
    }
    step();
}

window.addEventListener('load', () => { initCanvas(); runAutoAnimation(); });
window.addEventListener('resize', initCanvas);
</script>

</body></html>
