<html lang="hu"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>Pitagorasz-tétel TV Elmélettel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; color: #1e293b; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .paper { background: white; padding: 30px 40px; max-width: 600px; width: 100%; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        canvas { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 4px; display: block; margin: 0 auto 20px; }
        .btn-tv-toggle { background: #0f766e; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; margin: 0 auto 20px auto; }
        .tv-wrapper { display: none; background: #334155; border: 12px solid #1e293b; border-radius: 24px; padding: 15px; margin-bottom: 25px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        .tv-screen { background: #134e4a; color: #ccfbf1; padding: 20px; border-radius: 12px; font-family: 'Courier New', monospace; min-height: 120px; border: 4px solid #0f172a; position: relative; overflow: hidden; }
        .tv-screen::after { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; pointer-events: none; }
        .tv-title { font-weight: bold; font-size: 15px; color: #fde047; margin-bottom: 8px; border-bottom: 1px solid #fde047; padding-bottom: 4px; }
        .tv-text { font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }
        input.box { border: 1.5px solid #000; border-radius: 2px; text-align: center; font-weight: bold; width: 75px; height: 26px; }
        .correct { background: #86efac !important; } .incorrect { background: #fca5a5 !important; }
        .explain { display: none; background: #fef2f2; border-left: 4px solid #ef4444; color: #991b1b; padding: 6px 10px; font-size: 13px; margin-top: 4px; }
        .row { margin: 12px 0; font-size: 15px; }
        .btn-finish { background: #0f766e; color: white; border: none; padding: 10px 30px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; font-size: 16px; width: 100%; }
        #res { margin-top: 15px; font-weight: bold; text-align: center; font-size: 16px; }
    </style>
</head>
<body>
<div class="paper">
    <h2 style="text-align: center; color: #1e293b;">Pitagorasz-tétel: a² + b² = c²</h2>
    <button class="btn-tv-toggle" onclick="toggleTV()">📺 Segítség / Elmélet (TV Ki/Be)</button>

    <div class="tv-wrapper" id="tvContainer" style="display: none;">
        <div class="tv-screen">
            <div class="tv-title">📺 TV Elméleti Adás – Geometria</div>
            <div class="tv-text" id="tvTypingText"></div>
        </div>
    </div>

    <canvas id="cv" width="180" height="120"></canvas>

    <div class="row">1. Ha a=3 és b=4, mennyi az átfogó (c)? 
        <input class="box" data-ans="5" data-exp="3² + 4² = 9 + 16 = 25 ⟹ √25 = 5.">
        <div class="explain"></div>
    </div>
    <div class="row">2. Ha a=6 és c=10, mennyi a 'b' befogó? 
        <input class="box" data-ans="8" data-exp="b² = 10² - 6² = 100 - 36 = 64 ⟹ √64 = 8.">
        <div class="explain"></div>
    </div>
    <div class="row">3. Milyen háromszögekre érvényes a tétel? 
        <input class="box" data-ans="derékszögű" data-exp="A tétel kizárólag derékszögű háromszögekre igaz.">
        <div class="explain"></div>
    </div>
    <div class="row">4. Hogy hívjuk a leghosszabb oldalt? 
        <input class="box" data-ans="átfogó" data-exp="A derékszöggel szemközti oldal az átfogó.">
        <div class="explain"></div>
    </div>
    <div class="row">5. Ha a=5 és b=12, mennyi c? 
        <input class="box" data-ans="13" data-exp="5² + 12² = 25 + 144 = 169 ⟹ √169 = 13.">
        <div class="explain"></div>
    </div>

    <button class="btn-finish" onclick="check()">Finish!</button>
    <div id="res"></div>
</div>

<script>
const elmeletSzoveg = "A Pitagorasz-tétel kimondja:\n\nBármely derékszögű háromszögben a két befogó négyzetének összege egyenlő az átfogó négyzetével.\n\n" +
"• Képlet: a² + b² = c²\n" +
"• 'a' és 'b': A derékszöget közrefogó oldalak (befogók).\n" +
"• 'c': A derékszöggel szemközti leghosszabb oldal (átfogó).";

let typingIndex = 0, typingInterval = null;
function toggleTV() {
    const tv = document.getElementById('tvContainer'), tvText = document.getElementById('tvTypingText');
    if (tv.style.display === 'block') {
        tv.style.display = 'none'; clearInterval(typingInterval); tvText.textContent = '';
    } else {
        tv.style.display = 'block'; tvText.textContent = ''; typingIndex = 0;
        typingInterval = setInterval(() => {
            if (typingIndex < elmeletSzoveg.length) { tvText.textContent += elmeletSzoveg.charAt(typingIndex++); }
            else { clearInterval(typingInterval); }
        }, 30);
    }
}

const ctx = document.getElementById('cv').getContext('2d');
let angle = 0;
function draw() {
    ctx.clearRect(0,0,180,120);
    ctx.save(); ctx.translate(90,60); ctx.rotate(Math.sin(angle)*0.1);
    ctx.strokeStyle = '#0f766e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-40,30); ctx.lineTo(40,30); ctx.lineTo(-40,-30); ctx.closePath(); ctx.stroke();
    ctx.restore(); angle += 0.04; requestAnimationFrame(draw);
}
draw();

function check() {
    let inputs = document.querySelectorAll('.box'), correct = 0;
    inputs.forEach(inp => {
        let exp = inp.closest('.row').querySelector('.explain');
        if(inp.value.trim().toLowerCase() === inp.dataset.ans.toLowerCase()) {
            inp.className='box correct'; correct++; if(exp) exp.style.display='none';
        } else {
            inp.className='box incorrect';
            if(exp) { exp.innerHTML='<b>Magyarázat:</b> ' + inp.dataset.exp; exp.style.display='block'; }
        }
    });
    const res = document.getElementById('res');
    res.textContent = `Eredmény: ${correct} / ${inputs.length} pont (${Math.round((correct/inputs.length)*100)}%)`;
    res.style.color = correct === inputs.length ? '#16a34a' : '#dc2626';
}
</script>

</body></html>
