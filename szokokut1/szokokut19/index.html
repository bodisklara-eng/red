<!DOCTYPE html>

<html lang="hu"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>Interaktív Exponenciális Munkalap</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .paper-container {
            background: #ffffff;
            width: 100%;
            max-width: 620px;
            padding: 35px 45px;
            border-radius: 4px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            border: 1px solid #cbd5e1;
            position: relative;
        }
        
        /* Kitűző rajz a bal felső sarokban */
        .pin {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 20px;
            height: 20px;
            background: #facc15;
            border-radius: 50%;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header-title {
            text-align: center;
            color: #dc2626;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .task-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .equation {
            font-size: 22px;
            font-weight: bold;
            color: #2563eb;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Minden fehér kocka alapstílusa */
        input.white-box {
            background-color: #ffffff;
            border: 1.5px solid #000000;
            border-radius: 2px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #000000;
            outline: none;
            padding: 0;
            font-family: inherit;
        }
        input.white-box:focus {
            border-color: #2563eb;
            box-shadow: 0 0 4px rgba(37, 99, 235, 0.4);
        }

        /* Helyes / Hibás visszajelzés */
        input.correct { background-color: #86efac !important; border-color: #16a34a !important; }
        input.incorrect { background-color: #fca5a5 !important; border-color: #dc2626 !important; }

        .row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
            font-size: 17px;
        }

        /* Tört szerkezet */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            margin: 0 4px;
        }
        .fraction-line {
            border-bottom: 2px solid #000000;
            margin: 2px 0;
        }

        /* Piros Finish gomb alul */
        .btn-finish {
            background-color: #e11d48;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.2s;
        }
        .btn-finish:hover { background-color: #be123c; }

        #score-msg {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="paper-container">
    <div class="pin"></div>

    <div class="header-title">Még egy kis gyakorlás dolgozathoz</div>

    <!-- 1. FELADAT -->
    <div style="margin-bottom: 40px;">
        <div class="task-title">1. Oldd meg a következő egyenletet!</div>
        <div class="equation">4<sup>x</sup> - 9 · 2<sup>x</sup> + 8 = 0</div>

        <!-- Új ismeretlen bevezetése mezők -->
        <div class="row" style="justify-content: flex-start; margin-left: 20px;">
            <span>új ismeretlen bevezetése:</span>
            <input type="text" class="white-box correct" style="width: 28px; height: 28px;" data-ans="y">
            <input type="text" class="white-box correct" style="width: 28px; height: 28px;" data-ans="=">
            <div style="position: relative; display: inline-block;">
                <input type="text" class="white-box correct" style="width: 28px; height: 28px;" data-ans="2">
                <input type="text" class="white-box correct" style="width: 22px; height: 20px; font-size: 12px; position: absolute; top: -10px; right: -20px;" data-ans="x">
            </div>
        </div>

        <div style="font-size: 15px; font-weight: bold; margin: 25px 0 20px 20px;">A másodfokú egyenlet két megoldása:</div>

        <div style="display: flex; justify-content: space-around; align-items: center; padding: 0 10px;">
            <div class="row">
                <input type="text" class="white-box incorrect" style="width: 75px; height: 35px;" data-ans="8|1">
                <span style="margin-left:5px;">Ebből x:</span>
                <input type="text" class="white-box incorrect" style="width: 40px; height: 32px;" data-ans="3|0">
            </div>
            <div class="row">
                <input type="text" class="white-box incorrect" style="width: 75px; height: 35px;" data-ans="1|8">
                <span style="margin-left:5px;">Ebből x:</span>
                <input type="text" class="white-box incorrect" style="width: 40px; height: 32px;" data-ans="0|3">
            </div>
        </div>
    </div>

    <!-- 2. FELADAT -->
    <div>
        <div class="task-title">2. Oldd meg a következő egyenletet!</div>
        <div class="equation"><sup>3</sup>√<span style="border-top:2px solid #2563eb;">2<sup>x</sup></span> = 2<sup>x</sup> · 8<sup>x+1</sup></div>

        <!-- Lépés 1 -->
        <div class="row">
            <div class="fraction">
                <input type="text" class="white-box incorrect" style="width: 32px; height: 24px;" data-ans="x">
                <div class="fraction-line"></div>
                <input type="text" class="white-box incorrect" style="width: 32px; height: 24px;" data-ans="3">
            </div>
            <span>2</span>
            <span>= 2</span>
            <input type="text" class="white-box incorrect" style="width: 28px; height: 24px;" data-ans="x">
            <span>· 2</span>
            <input type="text" class="white-box incorrect" style="width: 80px; height: 28px;" data-ans="3x+3|3(x+1)">
        </div>

        <!-- Lépés 2 -->
        <div class="row" style="margin-top:25px;">
            <div class="fraction">
                <input type="text" class="white-box incorrect" style="width: 32px; height: 24px;" data-ans="x">
                <div class="fraction-line"></div>
                <input type="text" class="white-box incorrect" style="width: 32px; height: 24px;" data-ans="3">
            </div>
            <span>2</span>
            <span>= 2</span>
            <input type="text" class="white-box incorrect" style="width: 95px; height: 30px;" data-ans="4x+3|x+3x+3">
        </div>

        <!-- Lépés 3 -->
        <div class="row" style="margin-top:25px;">
            <div class="fraction">
                <input type="text" class="white-box incorrect" style="width: 32px; height: 24px;" data-ans="x">
                <div class="fraction-line"></div>
                <input type="text" class="white-box incorrect" style="width: 32px; height: 24px;" data-ans="3">
            </div>
            <span>=</span>
            <input type="text" class="white-box incorrect" style="width: 100px; height: 30px;" data-ans="4x+3">
        </div>

        <!-- Lépés 4 -->
        <div class="row" style="margin-top:25px;">
            <input type="text" class="white-box incorrect" style="width: 85px; height: 30px;" data-ans="x">
            <span>=</span>
            <input type="text" class="white-box incorrect" style="width: 100px; height: 30px;" data-ans="12x+9">
        </div>

        <!-- Végeredmény -->
        <div class="row" style="margin-top:30px; font-size:22px;">
            <span>x =</span>
            <div class="fraction">
                <input type="text" class="white-box incorrect" style="width: 45px; height: 28px;" data-ans="-9">
                <div class="fraction-line"></div>
                <input type="text" class="white-box incorrect" style="width: 45px; height: 28px;" data-ans="11">
            </div>
        </div>
    </div>
</div>

<!-- Ellenőrző gomb -->
<button class="btn-finish" onclick="evaluateWorksheet()">Finish!</button>
<div id="score-msg" style="color: rgb(220, 38, 38);">Eredmény: 4 / 22 pont (18%)</div>

<script>
function evaluateWorksheet() {
    const inputs = document.querySelectorAll('input.white-box');
    let correct = 0;

    inputs.forEach(input => {
        const val = input.value.trim().replace(/\s+/g, '');
        const validOptions = input.getAttribute('data-ans').split('|');

        if (val !== "" && validOptions.includes(val)) {
            input.classList.remove('incorrect');
            input.classList.add('correct');
            correct++;
        } else {
            input.classList.remove('correct');
            input.classList.add('incorrect');
        }
    });

    const msg = document.getElementById('score-msg');
    msg.textContent = `Eredmény: ${correct} / ${inputs.length} pont (${Math.round((correct/inputs.length)*100)}%)`;
    msg.style.color = correct === inputs.length ? '#16a34a' : '#dc2626';
}
</script>


</body></html>
