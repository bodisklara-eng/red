<html lang="hu"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>Másodfokú Egyenlet</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .paper { background: white; padding: 30px; max-width: 600px; border-radius: 8px; }
        canvas { background: #f8fafc; border: 1px solid #cbd5e1; display: block; margin: 0 auto 20px; }
        input.box { border: 1.5px solid #000; width: 45px; height: 26px; text-align: center; }
        .correct { background: #86efac !important; } .incorrect { background: #fca5a5 !important; }
        .explain { display: none; background: #fef2f2; border-left: 4px solid #ef4444; padding: 6px; font-size: 13px; margin-top: 4px; }
        .row { margin: 10px 0; }
        .btn { background: #dc2626; color: white; border: none; padding: 10px 30px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
<div class="paper">
    <h2>Egyenlet: f(x) = x² - 4x + 3</h2>
    <canvas id="cv" width="200" height="150"></canvas>
    
    <div class="row">1. Mennyi a diszkrimináns (b² - 4ac) értéke? 
        <input class="box" data-ans="4" data-exp="(-4)² - 4*1*3 = 16 - 12 = 4.">
        <div class="explain"></div>
    </div>
    <div class="row">2. Hány valós gyöke van az egyenletnek? 
        <input class="box" data-ans="2" data-exp="Mivel D &gt; 0 (D=4), 2 valós gyök van.">
        <div class="explain"></div>
    </div>
    <div class="row">3. Mi a kisebbik gyök (x₁)? 
        <input class="box" data-ans="1" data-exp="(4 - √4)/2 = (4 - 2)/2 = 1.">
        <div class="explain"></div>
    </div>
    <div class="row">4. Mi a nagyobbik gyök (x₂)? 
        <input class="box" data-ans="3" data-exp="(4 + √4)/2 = (4 + 2)/2 = 3.">
        <div class="explain"></div>
    </div>
    <div class="row">5. Mi a tengelypont X koordinátája? 
        <input class="box" data-ans="2" data-exp="x = -b / (2a) = 4 / 2 = 2.">
        <div class="explain"></div>
    </div>
    <button class="btn" onclick="check()">Finish!</button>
</div>
<script>
const ctx = document.getElementById('cv').getContext('2d');
let t = 0;
function draw() {
    ctx.clearRect(0,0,200,150);
    ctx.strokeStyle = '#94a3b8'; ctx.beginPath(); ctx.moveTo(0,100); ctx.lineTo(200,100); ctx.moveTo(50,0); ctx.lineTo(50,150); ctx.stroke();
    ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2; ctx.beginPath();
    for(let x = -1; x <= 5; x += 0.1) {
        let y = x*x - 4*x + 3;
        let px = 50 + x*20; let py = 100 - y*10;
        if(x===-1) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
    ctx.fillStyle = '#2563eb'; ctx.beginPath();
    let animX = 2 + Math.sin(t)*1;
    let animY = animX*animX - 4*animX + 3;
    ctx.arc(50 + animX*20, 100 - animY*10, 4, 0, Math.PI*2); ctx.fill();
    t += 0.03; requestAnimationFrame(draw);
}
draw();
function check() {
    document.querySelectorAll('.box').forEach(inp => {
        let exp = inp.closest('.row').querySelector('.explain');
        if(inp.value.trim() === inp.dataset.ans) { inp.className='box correct'; if(exp) exp.style.display='none'; }
        else { inp.className='box incorrect'; if(exp) { exp.innerHTML=inp.dataset.exp; exp.style.display='block'; } }
    });
}
</script>

</body></html>
