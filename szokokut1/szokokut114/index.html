<!DOCTYPE html>

<html lang="hu"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>Modulo Művelet TV Elmélettel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; color: #1e293b; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .paper { background: white; padding: 30px 40px; max-width: 600px; width: 100%; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        canvas { background: #0f172a; border-radius: 4px; display: block; margin: 0 auto 20px; }
        .btn-tv-toggle { background: #06b6d4; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; margin: 0 auto 20px auto; }
        .tv-wrapper { display: none; background: #334155; border: 12px solid #1e293b; border-radius: 24px; padding: 15px; margin-bottom: 25px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        .tv-screen { background: #164e63; color: #cffaff; padding: 20px; border-radius: 12px; font-family: 'Courier New', monospace; min-height: 120px; border: 4px solid #0f172a; position: relative; overflow: hidden; }
        .tv-screen::after { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; pointer-events: none; }
        .tv-title { font-weight: bold; font-size: 15px; color: #fde047; margin-bottom: 8px; border-bottom: 1px solid #fde047; padding-bottom: 4px; }
        .tv-text { font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }
        input.box { border: 1.5px solid #000; border-radius: 2px; text-align: center; font-weight: bold; width: 45px; height: 26px; }
        .correct { background: #86efac !important; } .incorrect { background: #fca5a5 !important; }
        .explain { display: none; background: #fef2f2; border-left: 4px solid #ef4444; color: #991b1b; padding: 6px 10px; font-size: 13px; margin-top: 4px; }
        .row { margin: 12px 0; font-size: 15px; }
        .btn-finish { background: #06b6d4; color: white; border: none; padding: 10px 30px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; font-size: 16px; width: 100%; }
        #res { margin-top: 15px; font-weight: bold; text-align: center; font-size: 16px; }
    </style>
</head>
<body>
<div class="paper">
    <h2 style="text-align: center; color: #1e293b;">Modulo Művelet (%)</h2>
    <button class="btn-tv-toggle" onclick="toggleTV()">📺 Segítség / Elmélet (TV Ki/Be)</button>

    <div class="tv-wrapper" id="tvContainer">
        <div class="tv-screen">
            <div class="tv-title">📺 TV Elméleti Adás – Modulo Művelet</div>
            <div class="tv-text" id="tvTypingText"></div>
        </div>
    </div>

    <canvas id="cv" width="100" height="100"></canvas>

    <div class="row">1. Mennyi <code>10 % 3</code> eredménye? 
        <input class="box" data-ans="1" data-exp="10 / 3 = 3, a maradék 1.">
        <div class="explain"></div>
    </div>
    <div class="row">2. Mennyi <code>14 % 5</code> eredménye? 
        <input class="box" data-ans="4" data-exp="14 / 5 = 2, a maradék 4.">
        <div class="explain"></div>
    </div>
    <div class="row">3. Milyen maradékot ad egy páros szám 2-vel osztva? 
        <input class="box" data-ans="0" data-exp="A páros számok 2-vel osztva 0 maradékot adnak.">
        <div class="explain"></div>
    </div>
    <div class="row">4. Mennyi <code>7 % 10</code> eredménye? 
        <input class="box" data-ans="7" data-exp="Mivel a 7 kisebb az osztónál, a maradék maga a 7.">
        <div class="explain"></div>
    </div>
    <div class="row">5. Ha 23 óra van, mennyi lesz 3 óra múlva (12 órás alapon)? (<code>26 % 12</code>) 
        <input class="box" data-ans="2" data-exp="26 / 12 = 2, a maradék 2 (azaz 2 óra).">
        <div class="explain"></div>
    </div>

    <button class="btn-finish" onclick="check()">Finish!</button>
    <div id="res"></div>
</div>

<script>
const elmeletSzoveg = "A modulo (jelölése: % vagy mod) az egész osztás maradékát adja meg.\n\n" +
"• Példa: 17 % 5 = 2, mert 17-ben az 5 megvan 3-szor, a MARADÉK a 2.\n" +
"• Gyakori felhasználás: Páros/páratlan számok vizsgálata (szám % 2 == 0), ciklikus folyamatok (pl. óra mutatója).";

let typingIndex = 0, typingInterval = null;
function toggleTV() {
    const tv = document.getElementById('tvContainer'), tvText = document.getElementById('tvTypingText');
    if (tv.style.display === 'block') {
        tv.style.display = 'none'; clearInterval(typingInterval); tvText.textContent = '';
    } else {
        tv.style.display = 'block'; tvText.textContent = ''; typingIndex = 0;
        typingInterval = setInterval(() => {
            if (typingIndex < elmeletSzoveg.length) { tvText.textContent += elmeletSzoveg.charAt(typingIndex++); }
            else { clearInterval(typingInterval); }
        }, 30);
    }
}

const ctx = document.getElementById('cv').getContext('2d');
let a = 0;
function draw() {
    ctx.clearRect(0,0,100,100);
    ctx.strokeStyle = '#06b6d4'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(50,50,35,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(50,50);
    ctx.lineTo(50 + Math.cos(a)*25, 50 + Math.sin(a)*25); ctx.stroke();
    a += 0.05; requestAnimationFrame(draw);
}
draw();

function check() {
    let inputs = document.querySelectorAll('.box'), correct = 0;
    inputs.forEach(inp => {
        let exp = inp.closest('.row').querySelector('.explain');
        if(inp.value.trim() === inp.dataset.ans) {
            inp.className='box correct'; correct++; if(exp) exp.style.display='none';
        } else {
            inp.className='box incorrect';
            if(exp) { exp.innerHTML='<b>Magyarázat:</b> ' + inp.dataset.exp; exp.style.display='block'; }
        }
    });
    const res = document.getElementById('res');
    res.textContent = `Eredmény: ${correct} / ${inputs.length} pont (${Math.round((correct/inputs.length)*100)}%)`;
    res.style.color = correct === inputs.length ? '#16a34a' : '#dc2626';
}
</script>

</body></html>
