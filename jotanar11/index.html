    # Cél: target_base / MAIN_FOLDER
    target_root = os.path.join(target_base, MAIN_FOLDER)

    skipped_non_html = 0
    skipped_excluded = 0

    print(f"\\n[SCAN] Bejárás: os.walk({actual_source}) - CSAK .html/.htm")

        # Kizárt mappák kiszűrése - módosítjuk a dirs listát in-place, így os.walk nem megy beléjük
        original_dirs = dirs[:]
        dirs[:] = [d for d in dirs if not should_skip_dir(d)]
        skipped_excluded += len(original_dirs) - len(dirs)

        # Minden fájl ellenőrzése
        for filename in files:

            if filename == SCRIPT_NAME:
                continue
            
            full_path = os.path.join(current_root, filename)

            if not is_html_file(filename):
                skipped_non_html += 1
                # Debug: csak első 5 nem-HTML-t logoljuk
                if skipped_non_html <= 5:
                    print(f"  [SKIP nem HTML] {filename}")

            html_files_found.append(full_path)

    generated_links = []

    for src_html_path in html_files_found:

        subfolder_name = f"{PREFIX}{counter}"
        dest_subfolder = os.path.join(target_root, subfolder_name)
        os.makedirs(dest_subfolder, exist_ok=True)

        dest_file = os.path.join(dest_subfolder, "index.html")

        try:
            shutil.copy2(src_html_path, dest_file)
            print(f"[COPY] {os.path.basename(src_html_path)} -> {MAIN_FOLDER}/{subfolder_name}/index.html")

            # Vercel link generálása: BASE_VERCEL_URL/MAIN_FOLDER/subfolder
            vercel_link = f"{BASE_VERCEL_URL}/{MAIN_FOLDER}/{subfolder_name}"
            generated_links.append((subfolder_name, vercel_link, src_html_path))

        except Exception as e:
            print(f"[HIBA] Másolás sikertelen {src_html_path} -> {dest_file}: {e}")

    print("="*60)

        print("\\nGenerált Vercel linkek:")
        for subfolder, link, original in generated_links:
            print(f"  {subfolder}: {link}  (forrás: {os.path.basename(original)})")

        # Linkek mentése txt-be is
        links_file = os.path.join(target_root, "_vercel_links.txt")
        try:
            with open(links_file, "w", encoding="utf-8") as f:
                f.write(f"# Vercel linkek - {MAIN_FOLDER} - {PROJECT_NAME}\\n")
                f.write(f"# SOURCE: {actual_source}\\n")
                f.write(f"# Csak HTML: {len(html_files_found)} db\\n\\n")
                for subfolder, link, original in generated_links:
                    f.write(f"{link}  # {original}\\n")
            print(f"\\n[INFO] Linkek elmentve: {links_file}")
        except Exception as e:
            print(f"[HIBA] Link fájl mentése sikertelen: {e}")

if __name__ == "__main__":
    main()
