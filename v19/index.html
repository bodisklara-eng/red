<html lang="hu"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buborékfújó Fűnyíró Animáció</title>
    <style>
        body {
            background-color: #eef7fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1 {
            color: #1a5276;
            margin-bottom: 15px;
            font-size: 24px;
        }
        canvas {
            background: #f0f8ff;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border: 2px solid #bce0fd;
        }
    </style>
</head>
<body>

    <h1>Buborékfújó Fűnyíró Animáció</h1>
    <canvas id="mowerCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('mowerCanvas');
        const ctx = canvas.getContext('2d');

        // --- ANIMÁCIÓS VÁLTOZÓK ---
        let angle = 0;
        const wandCenter = { x: 500, y: 320 };
        const numWands = 6;
        const wandRadius = 35;

        // --- BUBORÉKOK RENDSZERE ---
        const bubbles = [];
        const numBubbles = 25;

        function createBubble() {
            return {
                x: wandCenter.x,
                y: wandCenter.y,
                size: Math.random() * 12 + 8,
                vx: -(Math.random() * 2 + 1.5), // Balra szállnak
                vy: -(Math.random() * 2 + 1),   // Felfelé szállnak
                alpha: Math.random() * 0.5 + 0.4,
                wobble: Math.random() * Math.PI * 2
            };
        }

        for (let i = 0; i < numBubbles; i++) {
            let b = createBubble();
            // Elszórjuk őket kezdetben a képernyőn
            b.x = wandCenter.x + b.vx * (i * 12);
            b.y = wandCenter.y + b.vy * (i * 12);
            bubbles.push(b);
        }

        // --- RAJZOLÓ FÜGGVÉNYEK ---
        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Zöld fű (Talaj)
            ctx.fillStyle = '#7ec850';
            ctx.fillRect(0, 420, canvas.width, 80);

            // 2. Narancssárga tolókar
            ctx.strokeStyle = '#ff6600';
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(350, 350);
            ctx.lineTo(180, 150);
            ctx.stroke();

            // Fogantyú
            ctx.beginPath();
            ctx.moveTo(140, 130);
            ctx.lineTo(220, 170);
            ctx.stroke();

            // 3. Hátsó kerék (Kicsi)
            drawWheel(330, 410, 35);
            
            // 4. Kék test
            ctx.fillStyle = '#0099ff';
            ctx.beginPath();
            ctx.roundRect(310, 340, 260, 80, 20);
            ctx.fill();

            // 5. Zöld motorháztető
            ctx.fillStyle = '#8ce600';
            ctx.beginPath();
            ctx.arc(480, 345, 55, 0, Math.PI * 2);
            ctx.fill();

            // 6. Első kerék (Nagy)
            drawWheel(550, 410, 42);

            // 7. Forgó buborékfújó tárcsa
            drawSpinner();

            // 8. Buborékok frissítése és rajzolása
            drawBubbles();

            angle += 0.08; // Forgási sebesség
            requestAnimationFrame(drawScene);
        }

        function drawWheel(x, y, radius) {
            ctx.fillStyle = '#8ce600';
            ctx.strokeStyle = '#5bb300';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Belső felni
            ctx.fillStyle = '#5bb300';
            ctx.beginPath();
            ctx.arc(x, y, radius / 2.5, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawSpinner() {
            for (let i = 0; i < numWands; i++) {
                let currentAngle = angle + i * (Math.PI * 2 / numWands);
                let xEnd = wandCenter.x + wandRadius * Math.cos(currentAngle);
                let yEnd = wandCenter.y + wandRadius * Math.sin(currentAngle);

                // Pálca
                ctx.strokeStyle = '#ff6600';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(wandCenter.x, wandCenter.y);
                ctx.lineTo(xEnd, yEnd);
                ctx.stroke();

                // Karika a végén
                ctx.beginPath();
                ctx.arc(xEnd, yEnd, 8, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function drawBubbles() {
            bubbles.forEach((b) => {
                // Mozgás
                b.wobble += 0.05;
                b.x += b.vx + Math.sin(b.wobble) * 0.5;
                b.y += b.vy;

                // Ha kiment a képernyőről, újat indítunk
                if (b.x < -20 || b.y < -20) {
                    Object.assign(b, createBubble());
                }

                // Buborék rajzolása
                ctx.save();
                ctx.globalAlpha = b.alpha;
                
                // Buborék teste
                ctx.fillStyle = '#00d4ff';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Csillanás a buborékon
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(b.x - b.size * 0.3, b.y - b.size * 0.3, b.size * 0.25, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });
        }

        // Animáció indítása
        drawScene();
    </script>

</body></html>
