<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Suttogó Erdő - Napelemes Vízkifolyó Kellékelőkészítő</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0f18;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 8px;
            color: #7aa2f7;
            font-size: 1.4rem;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #2ac3de;
        }
        canvas {
            display: block;
            cursor: pointer;
        }
        .instruction {
            margin-top: 10px;
            color: #a9b1d6;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>A Suttogó Erdő - Napelemes Vízkifolyó Kellékelőkészítő</h1>
    <div id="game-container">
        <canvas id="canvas" width="840" height="560"></canvas>
    </div>
    <p class="instruction">🔑 Kattints a lebegő kulcsra! Nyitás után az eszközök a barlangból a farkas elé repülnek.</p>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let tick = 0;
let state = {
    keyState: 'floating', // 'floating', 'moving', 'unlocking', 'unlocked'
    doorOpen: false,
    doorProgress: 0,
    itemsFlying: false,
    flyStartTick: 0,
    message: "A kapu zárva! Kattints a lebegő kulcsra a nyitáshoz!",
    messageTimer: 240,
    keyX: 490,
    keyY: 230,
    targetX: 710,
    targetY: 205,
    keyAngle: 0
};

// Az infografika szerinti eszközök sorrendben, pontos adatokkal a diákok számára
const tools = [
    {
        id: 1,
        name: "1. Alsó tartály",
        size: "50–100 liter",
        qty: "1 db",
        prop: "Műanyag edény (vízszintes talajra)",
        x: 70, y: 370, currentX: 710, currentY: 205
    },
    {
        id: 2,
        name: "2. Szivattyú + Szűrő",
        size: "12V DC (800-1500 l/h)",
        qty: "1+1 db",
        prop: "Merülő szivattyú durvaszűrővel",
        x: 205, y: 370, currentX: 710, currentY: 205
    },
    {
        id: 3,
        name: "3. Tartóállvány",
        size: "2,0 – 2,2 m magas",
        qty: "1 db",
        prop: "Fa vagy fém (stabil szerkezet)",
        x: 340, y: 370, currentX: 710, currentY: 205
    },
    {
        id: 4,
        name: "4. PET-palack",
        size: "1,5 – 2 liter",
        qty: "1 db",
        prop: "Légkamra (6-8 mm kifolyóval)",
        x: 475, y: 370, currentX: 710, currentY: 205
    },
    {
        id: 5,
        name: "5. Cső & Szerelvény",
        size: "Ø 12–16 mm",
        qty: "1 szett",
        prop: "Műanyag cső, teflon/szilikon",
        x: 610, y: 370, currentX: 710, currentY: 205
    },
    {
        id: 6,
        name: "6. Napelem modul",
        size: "20 W / 12 V",
        qty: "1 szett",
        prop: "Kábelekkel (opt. akku/vezérlő)",
        x: 745, y: 370, currentX: 710, currentY: 205
    }
];

// Varázsporszemcsék
const particles = [];
for (let i = 0; i < 40; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 1,
        speedY: Math.random() * 0.4 + 0.1,
        alpha: Math.random()
    });
}

// Interakciók
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // Farkas
    if (x > 180 && x < 290 && y > 180 && y < 320) {
        if (!state.doorOpen) {
            showMessage("A farkas a lebegő kulcsra mutat. Kattints rá a barlang nyitásához!");
        } else {
            showMessage("A farkas elé megérkeztek a kellékek az összeszerelés sorrendjében!");
        }
    }

    // Kút
    if (x > 360 && x < 440 && y > 240 && y < 330) {
        showMessage("A kút friss vizet biztosít a napelemes rendszer feltöltéséhez!");
    }

    // Kulcs
    let currentKeyY = state.keyState === 'floating' ? state.keyY + Math.sin(tick * 0.06) * 10 : state.keyY;
    let distToKey = Math.hypot(x - state.keyX, y - currentKeyY);
    if (distToKey < 45 && state.keyState === 'floating') {
        state.keyState = 'moving';
        state.keyY = currentKeyY;
        showMessage("A mágikus kulcs a barlang zárjába repül...");
    }
});

function showMessage(text) {
    state.message = text;
    state.messageTimer = 220;
}

// HOLD ÉS CSILLAGOK
function drawSparklingMoon(x, y, radius) {
    let auraRadius = radius + 20 + Math.sin(tick * 0.05) * 6;
    let moonGlow = ctx.createRadialGradient(x, y, radius * 0.4, x, y, auraRadius);
    moonGlow.addColorStop(0, 'rgba(224, 247, 250, 0.9)');
    moonGlow.addColorStop(1, 'rgba(125, 207, 255, 0)');
    
    ctx.fillStyle = moonGlow;
    ctx.beginPath();
    ctx.arc(x, y, auraRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f0fdfa';
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
}

// FÁK
function drawPineTree(x, baseY, width, height, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x - width * 0.1, baseY - height * 0.2, width * 0.2, height * 0.2);
    for (let i = 0; i < 3; i++) {
        let layerY = baseY - height * 0.15 - (i * (height * 0.26));
        let layerWidth = width * (1 - i * 0.22);
        ctx.beginPath();
        ctx.moveTo(x, layerY - height * 0.45);
        ctx.lineTo(x + layerWidth / 2, layerY);
        ctx.lineTo(x - layerWidth / 2, layerY);
        ctx.closePath();
        ctx.fill();
    }
}

// KÚT
function drawWell(x, y) {
    ctx.fillStyle = '#334155';
    ctx.fillRect(x - 20, y - 15, 40, 25);
    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.ellipse(x, y - 15, 20, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath(); ctx.ellipse(x, y - 15, 16, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7c3f1d';
    ctx.fillRect(x - 18, y - 45, 4, 30);
    ctx.fillRect(x + 14, y - 45, 4, 30);
    ctx.beginPath();
    ctx.moveTo(x - 24, y - 43); ctx.lineTo(x, y - 58); ctx.lineTo(x + 24, y - 43);
    ctx.strokeStyle = '#4a2511'; ctx.lineWidth = 3; ctx.stroke();
}

// BARLANG ÉS KAPU
function drawCaveDoor() {
    let archCenterX = 710;
    let archCenterY = 150;
    let archRadius = 45;

    ctx.fillStyle = state.doorOpen ? '#0284c7' : '#030712';
    ctx.beginPath();
    ctx.arc(archCenterX, archCenterY, archRadius, Math.PI, 0);
    ctx.rect(665, archCenterY, 90, 160);
    ctx.fill();

    if (state.doorOpen && state.doorProgress < 45) {
        state.doorProgress += 0.8;
    }

    ctx.save();
    ctx.beginPath();
    ctx.arc(archCenterX, archCenterY, archRadius, Math.PI, 0);
    ctx.rect(665, archCenterY, 90, 160);
    ctx.clip();

    let leftDoorX = 665 - state.doorProgress;
    let rightDoorX = 710 + state.doorProgress;

    ctx.fillStyle = '#5c2c16';
    ctx.fillRect(leftDoorX, 105, 45, 205);
    ctx.fillRect(rightDoorX, 105, 45, 205);
    ctx.strokeStyle = '#1e1107'; ctx.lineWidth = 2;
    ctx.strokeRect(leftDoorX, 105, 45, 205);
    ctx.strokeRect(rightDoorX, 105, 45, 205);

    if (!state.doorOpen) {
        ctx.fillStyle = '#d97706';
        ctx.beginPath(); ctx.arc(archCenterX, 205, 10, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();

    // Sziklafal
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.moveTo(590, 310);
    ctx.lineTo(610, 80);
    ctx.quadraticCurveTo(710, 50, 830, 70);
    ctx.lineTo(840, 310); // Javítva!
    ctx.lineTo(755, 310);
    ctx.lineTo(755, archCenterY);
    ctx.arc(archCenterX, archCenterY, archRadius, 0, Math.PI, true);
    ctx.lineTo(665, 310);
    ctx.closePath();
    ctx.fill();
}

// KULCS ANIMÁCIÓ
function updateAndDrawKey() {
    if (state.keyState === 'unlocked') return;

    let currentX = state.keyX;
    let currentY = state.keyY;

    if (state.keyState === 'floating') {
        currentY += Math.sin(tick * 0.06) * 10;
    } else if (state.keyState === 'moving') {
        state.keyX += (state.targetX - state.keyX) * 0.08;
        state.keyY += (state.targetY - state.keyY) * 0.08;
        currentX = state.keyX; currentY = state.keyY;
        if (Math.hypot(state.targetX - state.keyX, state.targetY - state.keyY) < 3) {
            state.keyState = 'unlocking';
        }
    } else if (state.keyState === 'unlocking') {
        currentX = state.targetX; currentY = state.targetY;
        state.keyAngle += 0.08;
        if (state.keyAngle >= Math.PI) {
            state.keyState = 'unlocked';
            state.doorOpen = true;
            state.itemsFlying = true;
            state.flyStartTick = tick;
            showMessage("A kapu kinyílt! Az eszközök kirepülnek az előkészítés sorrendjében.");
        }
    }

    ctx.save();
    ctx.translate(currentX, currentY);
    ctx.rotate(state.keyAngle);
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(-8, 0, 7, 0, Math.PI * 2);
    ctx.moveTo(0, 0); ctx.lineTo(14, 0); ctx.lineTo(14, 5); ctx.stroke();
    ctx.restore();
}

// ESZKÖZ IKONOK
function drawToolIcon(id, x, y) {
    ctx.save();
    ctx.translate(x, y);

    if (id === 1) {
        ctx.fillStyle = '#1e293b';
        ctx.beginPath(); ctx.ellipse(0, 0, 20, 11, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath(); ctx.ellipse(0, -2, 16, 7, 0, 0, Math.PI * 2); ctx.fill();
    } else if (id === 2) {
        ctx.fillStyle = '#0f172a'; ctx.fillRect(-12, -8, 18, 14);
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(6, -3, 6, 5);
        ctx.fillStyle = '#475569'; ctx.fillRect(-18, -5, 6, 8);
    } else if (id === 3) {
        ctx.strokeStyle = '#7c3f1d'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-8, 12); ctx.lineTo(-8, -14);
        ctx.moveTo(8, 12); ctx.lineTo(8, -14);
        ctx.moveTo(-12, -4); ctx.lineTo(12, -4); ctx.stroke();
    } else if (id === 4) {
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(-7, -12, 14, 20);
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(-3, 8, 6, 4);
    } else if (id === 5) {
        ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 1.5); ctx.stroke();
        ctx.fillStyle = '#2563eb'; ctx.fillRect(6, -12, 6, 6);
    } else if (id === 6) {
        ctx.fillStyle = '#1e3a8a'; ctx.strokeStyle = '#93c5fd'; ctx.lineWidth = 1;
        ctx.fillRect(-14, -10, 28, 18); ctx.strokeRect(-14, -10, 28, 18);
    }
    ctx.restore();
}

// BEREPERÜLŐ ESZKÖZÖK ÉS ADATLAPOK
function updateAndDrawTools() {
    if (!state.itemsFlying) return;

    let elapsed = tick - state.flyStartTick;

    tools.forEach((t, idx) => {
        let delay = idx * 15;
        if (elapsed > delay) {
            t.currentX += (t.x - t.currentX) * 0.08;
            t.currentY += (t.y - t.currentY) * 0.08;
        }

        // Adatkártya
        ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        
        ctx.beginPath();
        if (ctx.roundRect) {
            ctx.roundRect(t.currentX - 56, t.currentY - 25, 112, 180, 8);
        } else {
            ctx.rect(t.currentX - 56, t.currentY - 25, 112, 180);
        }
        ctx.fill();
        ctx.stroke();

        // Ikon
        drawToolIcon(t.id, t.currentX, t.currentY);

        // Szöveg diákoknak
        ctx.textAlign = 'center';
        
        ctx.fillStyle = '#7aa2f7';
        ctx.font = 'bold 11px Segoe UI';
        ctx.fillText(t.name, t.currentX, t.currentY + 28);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '10px Segoe UI';
        ctx.fillText("Méret:", t.currentX, t.currentY + 44);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(t.size, t.currentX, t.currentY + 56);

        ctx.fillStyle = '#f8fafc';
        ctx.fillText("Darabszám:", t.currentX, t.currentY + 72);
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 11px Segoe UI';
        ctx.fillText(t.qty, t.currentX, t.currentY + 85);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '9px Segoe UI';
        let words = t.prop.split(" ");
        let mid = Math.ceil(words.length / 2);
        let line1 = words.slice(0, mid).join(" ");
        let line2 = words.slice(mid).join(" ");
        ctx.fillText(line1, t.currentX, t.currentY + 105);
        ctx.fillText(line2, t.currentX, t.currentY + 117);
    });
}

// FARKAS
function drawWolf(x, y) {
    ctx.save();
    ctx.translate(x, y);
    let breath = Math.sin(tick * 0.06) * 2;
    ctx.fillStyle = '#475569';
    ctx.beginPath();
    ctx.ellipse(0, 0, 28, 18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.arc(18, -14 + breath, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath(); ctx.arc(22, -16 + breath, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

// FŐ RAJZOLÓ CIKLUS
function animate() {
    tick++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Háttér
    let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#090c19');
    bgGrad.addColorStop(1, '#1a2238');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawSparklingMoon(100, 70, 32);
    drawPineTree(30, 310, 60, 150, '#131b2e');
    drawPineTree(110, 310, 70, 170, '#0f172a');
    drawPineTree(510, 310, 65, 160, '#131b2e');

    // Varázspor
    ctx.fillStyle = '#7dcfff';
    particles.forEach(p => {
        p.y -= p.speedY;
        if (p.y < 0) p.y = canvas.height;
        ctx.globalAlpha = Math.sin(tick * 0.05 + p.alpha) * 0.5 + 0.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // Talaj
    ctx.fillStyle = '#0b1120';
    ctx.fillRect(0, 310, canvas.width, 250);

    // Díszletek
    drawWell(400, 290);
    drawCaveDoor();
    drawWolf(230, 280);

    // Kulcs
    updateAndDrawKey();

    // Eszközök adatkártyákkal
    updateAndDrawTools();

    // Üzenet buborék
    if (state.messageTimer > 0) {
        state.messageTimer--;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
        ctx.fillRect(60, 12, 720, 42);
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1;
        ctx.strokeRect(60, 12, 720, 42);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '14px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(state.message, 420, 38);
    }

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
